name: Nightly full suite (no ROS or devices)
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Everything, the nightly tests included, on every supported Python: informational, never blocks a landing.
  tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: MHSeals/mhseals_hardware
          path: deps/mhseals_hardware
      - uses: actions/checkout@v4
        with:
          repository: MHSeals/mhseals_nav
          path: deps/mhseals_nav
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest rich PyYAML numpy pyserial pyubx2 pymavlink pillow
      - run: python -m pytest -q --durations=25 test
        env:
          PYTHONPATH: .:deps/mhseals_hardware:deps/mhseals_nav
          MHSEALS_NAV: deps/mhseals_nav
          MHS_BENCH_SCALE: '3'
