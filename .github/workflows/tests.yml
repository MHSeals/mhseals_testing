name: Test suite logic (no ROS or devices)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      # The suite reuses mhseals_hardware's mixer and configuration code.
      - uses: actions/checkout@v4
        with:
          repository: MHSeals/mhseals_hardware
          path: deps/mhseals_hardware
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest rich PyYAML numpy
      - run: python -m pytest -q test
        env:
          PYTHONPATH: .:deps/mhseals_hardware
