[develop]
script_dir=$base/lib/mhseals_testing
[install]
install_scripts=$base/lib/mhseals_testing
[pep8]
max-line-length = 79
[tool:pytest]
python_files = test_*.py
markers =
    sim: drives the out-of-repo sim rig ($SIMRIG); skipped without it
    timing: wall-clock frame budget; skipped unless MHS_TIMING=1
    own_colour_env: sets its own colour tier, theme and ASCII environment (conftest pins truecolor otherwise)
