# Scope of each config key (conditions_minimap.md 4.3). hardware = the physical build;
# calibration = fitted values (cadence run|site|build|derived); setting = operator choices (the default).
# depends_on: a calibration's `invalid` keys hash into its provenance (change => x),
# its `verify` keys only ask for a wiring check (change => ?).
# Everything is under `scope:` so it unions cleanly with other top-level blocks in this file.
# Keys that would be ambiguous bare are subsystem-qualified (rtk.device, nav2.vx_max).
scope:
  hardware:
    keys: [output_backend, pwm_topic, pwm_chips, pwm_channels, frequency, channel_map, reversed, thruster_matrix,
           hardware_epoch, gps_link, rtk.device, rtk.radio]
    patterns: ['mosfet_*', '*_TYPE', 'SERIAL*', 'CAN_*', 'BRD_*', 'GPS1_POS_*', 'COMPASS_ORIENT*', BATT_MONITOR, BATT_VOLT_MULT]
  calibration:
    run:
      keys: [decoupling, decoupling_negative, velocity_gain, 'characterization.curves']
      patterns: ['characterization.directions.*']
      depends_on:
        invalid: [thruster_matrix, reversed, hardware_epoch]
        verify: [channel_map, pwm_channels]
    derived:
      keys: ['characterization.motion_limits']
      patterns: ['nav2.v?_max', 'nav2.wz_max', 'nav2.acc_lim_*']
    site:
      keys: ['rtk.positions']
      patterns: ['COMPASS_OFS*', 'DIA*', 'ODI*', 'MOT*']
    build:
      patterns: ['INS_ACC*OFFS*', 'INS_ACC*SCAL*', 'AHRS_TRIM*']
  # setting keys whose change asks crab/yaw users for a check (shown as ?)
  yaw_deps:
    keys: [EK3_SRC1_YAW, magcal]
    patterns: ['COMPASS_USE*']
  ignored:
    patterns: ['INS_GYROFFS*']
    keys: [mechanical_bias]
# How config diffs read (history/render.py): labels, units, enums and matrix grids.
# A key not listed here still diffs, under "Other", by its own name.
# kind: scalar (default) | bool | enum | per (a list with one value per thruster) | matrix.
# digits: least decimals to show; more are added only when the difference needs them.
thrusters: [FL, FR, RR, RL]
axes: [surge, sway, yaw]
hardware:
  groups: [Thrusters, Correction, Timing, Manual, Output, Other]
  fields:
    channel_map: {label: output, group: Thrusters, kind: per, pins: true}
    reversed: {label: reversed, group: Thrusters, kind: per}
    thruster_matrix: {label: Mixer, group: Thrusters, kind: matrix, rows: thrusters, cols: axes, note: 'rows: thruster · cols: axis'}
    decoupling: {label: Correction C⁺, group: Correction, kind: matrix, rows: axes, cols: axes, note: 'rows: command · cols: applied'}
    decoupling_negative: {label: Correction C⁻, group: Correction, kind: matrix, rows: axes, cols: axes, note: 'rows: command · cols: applied'}
    command_timeout: {label: Command timeout, group: Timing, unit: s}
    frequency: {label: PWM frequency, group: Timing, unit: Hz}
    manual_amplitude: {label: Manual amplitude, group: Manual}
    manual_yaw_scale: {label: Manual yaw scale, group: Manual}
    manual_repeat_timeout: {label: Manual repeat timeout, group: Manual, unit: s}
    manual_initial_timeout: {label: Manual initial timeout, group: Manual, unit: s}
    output_backend: {label: Output backend, group: Output, kind: enum, choices: {odroid: ODROID PWM, topic: Topic}}
    pwm_topic: {label: PWM topic, group: Output}
    mosfet_chip: {label: MOSFET chip, group: Output}
    mosfet_line: {label: MOSFET line, group: Output}
    mosfet_active_high: {label: MOSFET active high, group: Output, kind: bool}
nav2:
  # Top-level sections shown under a plain name; "ros__parameters" levels are dropped.
  groups: {controller_server: Controller, planner_server: Planner, smoother_server: Smoother, bt_navigator: Navigator}
  units: {vx_max: m/s, vx_min: m/s, vy_max: m/s, wz_max: rad/s, ax_max: m/s², wz_acc: rad/s², lookahead: m, xy_goal_tolerance: m, yaw_goal_tolerance: rad}
