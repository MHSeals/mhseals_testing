# The physical boat: thruster_pwm_node drives the ODROID's PWM pins, and the
# mhseals_nav measurement stack fuses the flight controller and sensors.
name: boat
description: Physical boat; normalized thruster effort on /cmd_vel
command: {topic: /cmd_vel, type: twist, units: effort, limit: [1.0, 1.0, 1.0]}
odometry: /odom/local
ground_truth: null
frames: {map: map, odom: odom, base: base_link}
use_sim_time: false
arming: {outputs: odroid}
# --start-stack starts the components marked start; the Status rows start the rest.
components:
  odometry: {launch: [mhseals_nav, odom.launch.py], args: {sim: 'false', fcu: 'true'},
             nodes: [ekf_local, ekf_global, navsat_transform], start: true}
  sensors: {launch: [mhseals_nav, sensors.launch.py], args: {sim: 'false', sensors_ignore: camera},
            nodes: [velodyne_driver]}
  mapping: {launch: [mhseals_nav, slam.launch.py], args: {sim: 'false'}, nodes: [rtabmap],
            needs: [odometry]}
  navigation: {launch: [mhseals_nav, navigation.launch.py], args: {sim: 'false'}, limits: true,
               nodes: [bt_navigator], needs: [odometry]}
  objects: {launch: [mhseals_nav, objects.launch.py],
            args: {sim: 'false', rosbridge_url: 'ws://192.168.0.153:9090',
                   camera_root_frame: front_camera_link},
            nodes: [object_tracker]}
  # The ZED camera runs on squirtle (Foxy, domain 142); its detections reach us through
  # the zed_detections_converter on this host (perception.md 0.4).
  camera: {remote: squirtle, nodes: [zed_detections_converter], topic: /detections}
sensors:
  - {name: odometry, topic: /odom/local, kind: odometry, required: true}
  - {name: FCU odometry, topic: /odom/mavros, kind: odometry}
  - {name: GPS, topic: /gps/fix, kind: gps, required: true, hz: 5}
  - {name: IMU, topic: /imu/raw, kind: imu, required: true, hz: 20}
  - {name: GPS raw, topic: /mavros/gpsstatus/gps1/raw, kind: gpsraw}
  - {name: compass, topic: /mavros/imu/mag, kind: mag}
  - {name: LiDAR, topic: /points, kind: points}
  - {name: tracks, topic: /objects/map, kind: detections}
