# The physical boat: thruster_pwm_node drives the ODROID's PWM pins, and the
# mhseals_nav measurement stack fuses the flight controller and sensors.
name: boat
description: 'Real boat: ODROID PWM outputs; physical FCU and sensors feed mhseals_nav.'
command: {topic: /cmd_vel, type: twist, units: effort, limit: [1.0, 1.0, 1.0]}
odometry: /odom/local
ground_truth: null
frames: {map: map, odom: odom, base: base_link}
use_sim_time: false
arming: {outputs: odroid}
# Each component is a device part (mhseals_nav config/devices/): the registry's roles say which
# computer runs it (mhseals_testing.devices), and the Status row starts or stops it there.
# The components marked start come up with the session (attaches if already running); the
# Status rows start the rest. Only sensing carries start: never navigation or the mission.
# start: here starts it with the session only when this computer runs it (an operator's TUI).
# odometry and ekf never start with the session: over the radio link discovery can miss the boat's
# running stack for longer than the autostart waits, and a second MAVROS on the FCU link kills both.
# Off the simulator no start: comes up on another computer either (Stack.autostart).
# The safety watchdogs run inside odometry's launch on the boat (the odroid device profile's
# with: [watchdogs]): their row only shows them, never starts or stops a copy, and arming refuses
# while one is off the graph (pre.*_watchdog, gates: [arm]).
# needs: start first, each once the one before reports running (a part's start brings them up).
# stack: true parts are the Status panel's Stack row: Enter starts (or stops) them together, each
# through its own row's start path, after one confirm; never a part that can command motion.
components:
  odometry: {title: Odom stack, stack: true}   # the odom launch (MAVROS on the boat); its rate is the pose row
  ekf: {title: EKFs, needs: [odometry], stack: true}
  sensors: {stack: true}
  mapping: {needs: [odometry, ekf, sensors]}
  navigation: {limits: true, needs: [odometry, ekf, sensors]}
  camera: {stack: true}
  objects: {topic: /perception/tracks, stack: true}
  watchdogs: {title: Safety watchdogs}    # hold-only: operator link, fence, FCU, EKF inputs
  operator_heartbeat: {title: Operator heartbeat}   # a station service (hw.sh station take); link_watchdog holds without it
  host_diagnostic: {title: Camera host diagnostic}
sensors:
  - {name: odometry, label: pose, topic: /odom/local, kind: odometry, required: true}
  - {name: FCU odometry, label: FCU pose, topic: /odom/mavros, kind: odometry}
  - {name: GPS, topic: /gps/fix, kind: gps, required: true, hz: 10}   # Here4 10 Hz (nav mavros_setup '24:10')
  - {name: IMU, topic: /imu/raw, kind: imu, required: true, hz: 18}
  - {name: GPS raw, topic: /mavros/gpsstatus/gps1/raw, kind: gpsraw}
  - {name: compass, topic: /mavros/imu/mag, kind: mag}
  - {name: LiDAR, topic: /points, kind: points}
  - {name: tracks, topic: /objects/map, kind: detections}
