# crane_ml running the boat's full stack without ArduPilot: thruster_pwm_node
# publishes PWM to the simulator, which publishes the boat's sensor topics.
# Start crane_ml with --crane-disable-sitl --crane-ros-thruster-pwm --crane-roboboat-contract
# --crane-ros-nav-state, --crane-ros-port <endpoint unity.port> and
# --crane-roboboat-course-truth <host path of course_truth below>; boat_test then starts the
# components marked start (or attaches when the stack already runs).
name: crane_full_stack
description: 'Unity full stack: ROS PWM outputs and simulated sensors through mhseals_nav.'
command: {topic: /cmd_vel, type: twist, units: effort, limit: [1.0, 1.0, 1.0]}
odometry: /odom/local
ground_truth: /crane/odom
# Written by crane_ml's --crane-roboboat-course-truth; the referee judges missions with it. Relative
# to the data root ($MHSEALS_DATA, else $ROS_WS/bags).
course_truth: course_truth.json
frames: {map: map, odom: odom, base: base_link}
use_sim_time: true
# The simulator's sensor stamps run up to ~0.6 s ahead of /clock under load; the default 0.25 s trips the interlock.
stamp_future: 1.0
arming: {outputs: topic}
# Every part runs on this machine from mhseals_nav's sim device profile (odroid + jetson parts
# against the simulator); sensors with sim only starts the ROS-TCP endpoint crane_ml connects to.
placement: {self: [sim]}
components:
  odometry: {title: Odom stack, start: true}
  ekf: {title: EKFs, needs: [odometry], start: true}
  sensors: {start: true}
  mapping: {needs: [odometry, ekf]}
  navigation: {limits: true, needs: [odometry, ekf], start: true}
  objects: {start: true}
  watchdogs: {title: Safety watchdogs, start: true}
sensors:
  - {name: odometry, label: pose, topic: /odom/local, kind: odometry, required: true}
  - {name: FCU odometry, label: FCU pose, topic: /odom/mavros, kind: odometry}
  - {name: GPS, topic: /gps/fix, kind: gps, required: true}
  - {name: IMU, topic: /imu/raw, kind: imu, required: true}
  - {name: ground truth, topic: /crane/odom, kind: odometry}
  - {name: LiDAR, topic: /points, kind: points}
  - {name: detections, topic: /detections, kind: detections}
  - {name: tracks, topic: /objects/map, kind: detections}
  - {name: camera, topic: /front_camera/rgb/image, kind: image}

conditions: {velocity: odom:/odom/mavros}
