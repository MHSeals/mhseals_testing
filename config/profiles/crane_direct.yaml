# crane_ml driven straight through its own velocity controller, with no nav
# stack: quickest way to work on the suite itself. Start crane_ml with
# --crane-ros-nav-state --crane-ros-cmd-vel.
name: crane_direct
description: 'Unity direct: velocity commands and ground-truth odometry; bypasses mhseals_nav.'
command: {topic: /crane/cmd_vel_stamped, type: twist_stamped, units: velocity, limit: [1.0, 1.0, 1.0]}
odometry: /crane/odom
ground_truth: /crane/odom
frames: {map: null, odom: odom, base: base_link}
use_sim_time: true
arming: {outputs: none}
sensors:
  - {name: odometry, label: pose, topic: /crane/odom, kind: odometry, required: true}
  - {name: LiDAR, topic: /points, kind: points}

conditions: {velocity: odom:/crane/odom}
