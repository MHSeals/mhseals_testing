# Fusion tab (ui/panels/fusion.py, ros/fusion_feed.py): camera-lidar alignment at a glance.
# Topics are lidar_fusion.yaml's; /points and /tf_static come from the session's own subscriptions.
topics:
  observations: /perception/observations          # stereo boxes (the backend's ranges)
  fused: /perception/observations_fused           # lidar_fusion output; absent while fusion is off
  sources: /perception/fusion_sources             # JSON: source label per fused box, extrinsic samples
  camera_info: /front/zed_node/rgb/color/rect/camera_info
feed:
  points_hz: 2.0            # scans projected per second; the rest are dropped before decoding
  points_max: 3000          # projected points kept per scan (stride decimation)
  camera_hz: 1              # camera frames per second (1, 2 or 4); never over a budgeted link
  camera_width: 320         # px the frame is cut to on arrival (greyscale)
  max_range_m: 60.0         # points beyond this are not drawn
  residual_s: 120.0         # residual trend window
  stale_s: 2.0              # boxes or points older than this are dropped
draw_hz: 4.0               # camera and top-down repaints per second at most (boxes change every frame)
ramp_m: [5.0, 10.0, 20.0, 35.0, 50.0]   # range breaks for the point colours spd.1..spd.5 (spd.0 beyond)
rings_m: [5.0, 10.0, 15.0, 25.0, 40.0]  # top-down range rings; the outer one drawn is the first past every box
check:                      # same keys as fusion_calib.yaml check (perception-calib); live, not the recorded check
  near_m: 10.0
  du_pass_px: 5.0
  du_warn_px: 9.0
  hit_rate_min: 0.5
  range_tol: 0.05
  min_samples: 5            # extrinsic samples before the live check gives a verdict
