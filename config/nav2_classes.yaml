# The Nav2 parameters a running stack applies by itself (Nav2 Jazzy 1.3.13, checked against its
# dynamic-parameter callbacks). Flat `node.param` fnmatch patterns; the costmaps are written
# `<costmap>.<param>`. This is the one live list; `--now` may change any of it during a goal.
# Any other key: Navigation is reset, the keys are set, then it is started again.
# Not here on purpose: vx_max, vx_min and vy_max (ConstraintCritic and PathAngleCritic keep
# copies from configure), and the local costmap's inflation (CostCritic::findCircumscribedCost
# keeps the configure-time cost until the footprint's size changes).
live:
  # Critic weights: ParametersHandler::dynamicParamsCallback (CostCritic's own callback /254).
  - controller_server.FollowPath.*.cost_weight
  # Limits: MPPI ParametersHandler, RotationShimController::dynamicParametersCallback for the
  # shim; the std, prune and shim entries move with the limits.
  - controller_server.FollowPath.wz_max
  - controller_server.FollowPath.ax_max
  - controller_server.FollowPath.ax_min
  - controller_server.FollowPath.ay_max
  - controller_server.FollowPath.ay_min
  - controller_server.FollowPath.az_max
  - controller_server.FollowPath.vx_std
  - controller_server.FollowPath.vy_std
  - controller_server.FollowPath.wz_std
  - controller_server.FollowPath.prune_distance
  - controller_server.FollowPath.rotate_to_heading_angular_vel
  - controller_server.FollowPath.max_angular_accel
  # Smoother limits: VelocitySmoother::dynamicParametersCallback.
  - velocity_smoother.max_velocity
  - velocity_smoother.min_velocity
  - velocity_smoother.max_accel
  - velocity_smoother.max_decel
  # Footprint: Costmap2DROS::dynamicParametersCallback; CostCritic::score and the shim read it
  # each cycle. robot_radius only takes effect with no footprint, as after a reset.
  - local_costmap.footprint
  - local_costmap.footprint_padding
  - local_costmap.robot_radius
  - global_costmap.footprint
  - global_costmap.footprint_padding
  - global_costmap.robot_radius
  # Global inflation: InflationLayer::dynamicParametersCallback; SmacPlanner2D caches no cost.
  - global_costmap.inflation_layer.inflation_radius
  - global_costmap.inflation_layer.cost_scaling_factor
