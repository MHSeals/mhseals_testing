# The Nav2 parameters a running stack applies by itself (Nav2 Jazzy 1.3.13, checked against its
# dynamic-parameter callbacks). Flat `node.param` fnmatch patterns; the costmaps are written
# `<costmap>.<param>`. This is the one live list: only the motion limits, which `--now` may change
# during a goal. Any other key (cost weights and costmaps included): Navigation is reset, the keys
# are set, then it is started again.
# The controller's std, prune and rotation-shim entries move with the limits, so they are live too.
# Not here on purpose: vx_max, vx_min and vy_max (ConstraintCritic and PathAngleCritic keep
# copies from configure), and any costmap or cost_weight key.
live:
  - controller_server.FollowPath.wz_max
  - controller_server.FollowPath.ax_max
  - controller_server.FollowPath.ax_min
  - controller_server.FollowPath.ay_max
  - controller_server.FollowPath.ay_min
  - controller_server.FollowPath.az_max
  - controller_server.FollowPath.vx_std
  - controller_server.FollowPath.vy_std
  - controller_server.FollowPath.wz_std
  - controller_server.FollowPath.prune_distance
  - controller_server.FollowPath.rotate_to_heading_angular_vel
  - controller_server.FollowPath.max_angular_accel
  - velocity_smoother.max_velocity
  - velocity_smoother.min_velocity
  - velocity_smoother.max_accel
  - velocity_smoother.max_decel
