# boat_tui preview (tools/boat_preview): the owner's look at a ref's sim stack and TUI before a boat test, isolated
# from agents' work. Player, image, profile, command_mode, course_family, seed, ready_s and max_s come from
# config/sim/stack.yaml unless set here. Each key may be overridden by BOAT_PREVIEW_<KEY>; paths may start with ~.
ref: origin/main                     # the default REF
src: ~/astro_dock/src                # the checkouts the snapshot's worktrees come from
repos: [mhseals_hardware, mhseals_nav, mhseals_testing, ros_tcp_endpoint]   # REF where a repo has it, else origin/main
cache: ~/.cache/boat-preview         # <ref>/ws (worktrees, build, install), home, data, run
container: roboboat_preview          # its own container from the sim image; mounts only <ref>, config and results
socket: preview                      # tmux -L preview
session: preview
domain: 100                          # its own ROS_DOMAIN_ID (agent sims draw from 101..199), localhost discovery
port: 6768                           # its own ROS-TCP endpoint port, so an agent sim already running keeps its own (config/sim/stack.yaml port)
size: [1280, 720]                    # the player window
attach_s: 120                        # boat_tui preview waits this long for the TUI before printing the attach line
connect_s: 3                         # from the endpoint process to starting the player
# The sanity checklist: commits landed since `since` (a date or a ref), grouped by feature, the runbook's
# "before a test" items and these checks. Results append to results/preview-<date>.md.
since: '2026-11-01'
runbook: ~/astro_dock/src/mhseals_agents/runbooks/field.md
results: ~/astro_dock/src/mhseals_agents/state
checks:
  - {id: arm, text: 'Arming countdown shows and cancels: a, then cancel before it ends; nothing moves, disarmed'}
  - {id: fence, text: 'Course fence: the corners on the minimap match the course'}
  - {id: fence_exit, text: 'Leaving the fence alerts and the boat returns inside (or holds)'}
  - {id: characterize, text: 'Characterization (f): progress shows and it finishes or stops to neutral'}
  - {id: agent, text: 'Agent panel: an agent verb shows with its --why; a denied one shows the reason'}
  - {id: release, text: 'boat_agent release HOLD --why frees a lease or watchdog hold; an operator hold refuses'}
  - {id: restart, text: 'boat_tui preview restart: the new TUI takes over, the stack keeps running'}
  - {id: help, text: 'Help (?) matches the keys: each listed key does what it says'}
  - {id: terminal, text: "Movement draws in the operator's terminal: motion, minimap and camera keep up"}
# --test (an integration test, the only preview an agent may start): headless, its own everything, results in its run
# dir, and the heavy unity slot (queued behind a human preview) instead of the reserved preview slot.
test: {cache: ~/.cache/boat-preview-test, container: roboboat_preview_test, socket: preview-test, domain: 99,
       port: 6769, results: ''}
