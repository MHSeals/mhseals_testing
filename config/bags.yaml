# Recorder topic filter. `ros2 bag record -a` also records images and point clouds
# (crane_full_stack: ~50 MB/s), so the recorder takes every topic except these.
# Python regex matched against the full topic name (ros2 bag --exclude-regex). Anchored on the last
# path segment so /waypoints, /mavros/mission/waypoints and /perception/image_status stay recorded.
# RTAB-Map's growing grids are excluded by full name (/map, /grid_prob_map) so /objects/map (perception
# tracks) stays; the decimated minimap costmap is kept for replay, Nav2 costmaps are excluded.
# Recording a topic subscribes to it, which pulls the camera host's local and lazy topics across the
# LAN: the ZED wrapper (only its status is kept), observations, the track grid and the RViz markers.
# Raw detections are recorded on the camera host.
exclude_regex: '^(?!/mhseals_testing/minimap/costmap$|/[^/]+/zed_node/status/.*$)(/(map|grid_prob_map|tracked_objects)|/[^/]+/zed_node/.*|/perception/(observations|track_grid|detection_markers)|.*(costmap.*|/(points|cloud[^/]*|deskewed[^/]*|image(_raw|_rect[^/]*|_color)?(/compressed(Depth)?)?|camera_info)))$'

# Message types never recorded (ros2 bag --exclude-topic-types). Catches heavy topics the name regex misses
# (/scan_cloud, /livox/lidar, depth_registered, disparity_image, ...theora).
exclude_types:
  - sensor_msgs/msg/PointCloud2
  - sensor_msgs/msg/Image
  - sensor_msgs/msg/CompressedImage
  - stereo_msgs/msg/DisparityImage
  - nav2_msgs/msg/Costmap
  - theora_image_transport/msg/Packet
  - ffmpeg_image_transport_msgs/msg/FFMPEGPacket
  - point_cloud_interfaces/msg/CompressedPointCloud2
  - zed_msgs/msg/DepthInfoStamped
