# Characterization procedure (procedures/characterize.py).
levels: [1.0, 0.5]     # survey amplitudes as fractions of --amplitude: a_hi then a_lo
neutral_s: 20          # s of neutral at the start (wave floor and drift)
transient_s: 1.0       # s skipped at the start of each hold
coast_s: 2.0          # s skipped at the start of each neutral settle: the previous hold's coast-down
sync_s: 2.0            # s of neutral for the driver to pick up a rewritten C before a hold
refine: {max_holds: 3, probe: 0.15, headroom: 0.98, min_room: 0.2}
# headroom: a(1 + sum|c|) stays below it; min_room: smallest sum|c| the amplitude must allow
# Cross response per unit main response that counts as corrected, cross axes in index order.
tolerance:
  surge: [0.05, 0.015]   # sway (crab), yaw (rad/s per m/s)
  sway: [0.05, 0.015]    # surge (crab), yaw
  yaw: [0.10, 0.10]      # surge, sway: rotation-centre offset in m
