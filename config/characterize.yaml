# Characterization procedure (procedures/characterize.py).
levels: [1.0, 0.5]     # survey amplitudes as fractions of --amplitude: a_hi then a_lo
neutral_s: 20          # s of neutral at the start (wave floor and drift)
transient_s: 1.0       # s skipped at the start of each hold
coast_s: 2.0           # s of neutral skipped after a hold (coast-down); the wave floor skips the axis t95 if longer
# Smallest main response of an a_hi hold (m/s, rad/s for yaw) that counts as the direction moving
# the boat (the dec_opfit dead-response gate); below it the direction is marked dead, not fitted.
min_response: {surge: 0.03, sway: 0.03, yaw: 0.03}
sync_s: 2.0            # s of neutral for the driver to pick up a rewritten C before a hold
refine: {max_holds: 3, probe: 0.15, headroom: 0.98, min_room: 0.2}
# headroom: a(1 + sum|c|) stays below it; min_room: smallest sum|c| the amplitude must allow
# Cross response per unit main response that counts as corrected, cross axes in index order.
tolerance:
  surge: [0.05, 0.015]   # sway (crab), yaw (rad/s per m/s)
  sway: [0.05, 0.015]    # surge (crab), yaw
  yaw: [0.10, 0.10]      # surge, sway: rotation-centre offset in m
# Caps on the Nav2 limits the characterization writes: each limit is min(measured, rule).
# delay_s is the command-to-odometry dead time and tau_s the velocity loop's closed-loop lag per
# axis (the tuning procedure measures both; these are the crane_ml values until it has). The
# boat must stop within stop_distance_m of planning to (v^2 / 2a + v (tau + delay)), ramps take
# at least ramp_lags lags (a = v / (ramp_lags (tau + delay))), and a turn may overshoot by at most
# half the precise yaw tolerance (wz = yaw_tolerance / (2 (tau_yaw + delay))).
nav2_rules:
  delay_s: 0.15
  tau_s: {surge: 0.35, sway: 0.45, yaw: 0.15}
  stop_distance_m: 1.0
  ramp_lags: 3.0
  yaw_tolerance: 0.25
