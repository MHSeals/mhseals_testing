# Thresholds for the coupling-column iteration (analysis/thrust_columns.py); thrust math note.
amplitude: {hi: 0.6, lo: 0.3, yaw_hi: 0.3, yaw_lo: 0.15}   # normalized effort of the survey holds
headroom: 0.98            # a * (1 + sum |c_x|) must stay below this so a corrected hold cannot saturate
reverse_ratio: 0.78       # reverse thrust over forward thrust, the T200 figure
tolerance:                # allowed cross response per unit of |main| response, in cross-axis index order
  surge: [0.05, 0.015]    # crab (sway/surge), yaw rate (rad/s per m/s)
  sway: [0.05, 0.015]     # crab (surge/sway), yaw rate
  yaw: [0.10, 0.10]       # rotation-centre offset (m) along surge and sway
gate: {broyden_sigma: 3.0, dead_main_sigma: 5.0, noise_limited: 2.0}   # multiples of sigma
max_step: 0.5             # largest change of one column entry per iteration
trust_target: 0.9         # refine directions below this trust
refine_holds: 3           # Newton/Broyden holds per direction at the high amplitude
