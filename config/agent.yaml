# Agent control (boat_trial claim/run/goal/... and the agent hook for Claude Code and Codex). Hot reloaded.
# lease.idle_s: any verb or hook note by the claim's `who` renews it; motion_s: the blocking CLI of
# a running act renews it every motion_s/3. Expiry acts exactly like E: neutral, mux hold, goal
# cancelled. max_claim_s ends a claim that keeps renewing.
schema: mhseals.agent_config/1
lease: {idle_s: 120, motion_s: 10, max_claim_s: 3600}
request_s: 5            # a request past this is answered expired; never replayed after a restart
confirm_s: 30           # human confirm popup; timeout = refused
ask_s: 120
run: [square, station, nav2_bringup, controller_check, perception, mission]   # procedure keys agents may request
unclaimed_driver: warn  # warn | hold: hold asks for a mux hold when an unclaimed /cmd_vel drives >1 s while armed
# Sim-only auto-arm (owner decision 2026-10-26): `run KEY --sim-arm` arms for that run when every check of
# harness/sim_arm.py proves a sim (sim profile and clock, crane player, private domain in `domains`, never 42,
# localhost discovery, private-IPC container, no real-hardware node in `real_nodes`, the session's empty hold
# file, no <data root>/agent/stop). It never releases a hold and disarms when the run ends, after max_s, on a
# lapsed lease, when the stop file appears or when the graph re-check (every 5 s) stops proving a sim. A fresh sim
# session clears holds a previous session left in its own hold file; a --sim-arm run's Ready prompts are the agent's.
# This file is the boat's too, so it ships off. The sim container turns it on: `docker run -e MHSEALS_SIM_ARM=1`
# (crane_autodemo, roboboat_test); the boat's containers never set it. enabled: true here also turns it on.
sim_arm:
  enabled: false
  max_s: 1800
  domains: [101, 232]
  real_nodes: ['mavros\w*', 'zed_\w+', 'velodyne\w*', lidar_relay_publish, fcu_watchdog, host_diagnostic, 'ntrip\w*',
               'ublox\w*', thruster_pwm_node, command_mux]
hook:
  # local: notes go to this machine's channel (the sim/dev TUI), never over ssh. A boat session names its host
  # (BOAT_AGENT_TARGET=blastoise-odroid in the agent's environment, or here); only then do they go to path there.
  # `blastoise` still works for one release; it means blastoise-odroid.
  target: local
  path: /var/home/roboboat/astro_dock/bags/agent/channel.jsonl
  match: ['\bssh\s+(-\S+\s+)*(blastoise(-odroid|-jetson)?|squirtle(-jetson)?)\b', '\bros2\b', '\bdocker\s+exec\b']
  skip: ['\bboat_(trial|agent)\b']
  max_per_10s: 6
  # Two tiers. A call whose every command only reads, searches or prints text (grep, rg, echo, printf, cat,
  # head, tail, less, wc, sed -n with p and s/// only, git commit/log/diff/show/status, pytest), with no $(...),
  # backticks, <(...) and no file written, is never denied: a grep pattern or a commit message is data (write
  # files with the agent's Write/Edit tools, not the shell). Anything else is denied when a deny pattern is
  # found anywhere in its whole text (quotes dropped, across lines), or deny_boat when the text names a boat:
  # hosts (ssh host names, one per computer) and their vessel names (blastoise, squirtle: the former aliases),
  # the STATIC_LEASES hostnames and addresses of the vessel's network env (ASTRO_NETWORK_ENV), or an
  # ~/.ssh/config alias for them. Names match with or without the leading slash. Advisory: run-time strings and scripts from earlier
  # calls still get through, and so does /mavros/mission/push (a waypoint upload; the FCU drives nothing here):
  # noted in the TUI, not denied. ros2 bag play needs --topics without motion topics (cmd_vel*, thrusters, the
  # mux, MAVROS RC/setpoints). A ros2 write whose target is a $variable is denied: the hook cannot read it.
  # pkill and killall are denied (kill your own processes by exact PID); so is killing the boat's control, and
  # on a boat killing anything, stopping its containers or units and rebooting it: use boat_agent stop.
  deny: ['ros2\s+topic\s+pub\b.*(\bcmd_vel|\bcommand_mux\b|\bgoal_pose|\bmavros/(rc/override|setpoint|manual_control))',
         'ros2\s+action\s+send_goal\b.*(navigate|(?<![\w-])(spin|backup|drive_on_heading|follow_waypoints|follow_gps_waypoints|follow_path|dock_robot|undock_robot|assisted_teleop)\b)',
         'ros2\s+service\s+call\b.*\bmavros/(cmd/(arming|command)|set_mode|param/(set|push|load))',
         'ros2\s+(param\s+(set|load|delete)|lifecycle\s+set)\b.*\b(mavros|command_mux|\w*watchdog|approach_guard|thruster_pwm\w*|\w*velocity_controller)\b',
         'ros2\s+service\s+call\b.*\b(mavros\w*|command_mux|\w*watchdog|approach_guard|thruster_pwm\w*|\w*velocity_controller)/(set_parameters\w*|load_parameters|change_state)\b',
         'ros2\s+bag\s+play\b(?!.*--topics\b)',
         'ros2\s+bag\s+play\b.*--topics\b.*(cmd_vel|thrusters?\b|thruster_|command_mux|mavros/(rc/override|setpoint|manual_control))',
         'ros2\s+run\b[^;&|\n]*\bmavros\s+([^;&|\n]*\s)?mav\w*\b',
         'ros2\s+run\b[^;&|\n]*\bteleop_twist_\w+\b',
         'ros2\s+run\b[^;&|\n]*\bmhseals_hardware\s+([^;&|\n]*\s)?keyboard_control\b',
         # the operator's heartbeat: ros2 run (any flags or --prefix before the executable), -m, its script or installed path
         'ros2\s+run\b[^;&|\n]*\bmhseals_testing\s+([^;&|\n]*\s)?operator_heartbeat\b|\bpython[\d.]*\s+(-\S+\s+)*-m\s*mhseals_testing\.ros\.operator_heartbeat\b',
         '(^|[;&|(`\n]|\b(exec|nohup|setsid|sudo|env|time|nice|stdbuf|xargs|strace|timeout|python[\d.]*|bash|sh|dash|zsh)\b)\s*((-\S+|\w+=\S*|\d+\w*)\s+)*(/|~/|\.{1,2}/)?([\w.-]+/)*operator_heartbeat(\.py)?(?=\s|$|[;&|)`])',
         # raw PWM (test_pulses), Nav2 lifecycle/params (break a claimed goal), the mission runner and procedures
         # started directly: boat_agent run / goal, or ask the operator
         'ros2\s+(topic\s+pub|service\s+call)\b.*\bthruster_pwm_node/test_pulses\b',
         'ros2\s+(param\s+(set|load|delete)|lifecycle\s+set)\b.*\b(controller_server|planner_server|bt_navigator|behavior_server|smoother_server|velocity_smoother|collision_monitor|waypoint_follower|route_server|docking_server|lifecycle_manager\w*)\b',
         'ros2\s+service\s+call\b.*\b(controller_server|planner_server|bt_navigator|behavior_server|smoother_server|velocity_smoother|collision_monitor|waypoint_follower|route_server|docking_server|lifecycle_manager\w*)/(set_parameters\w*|load_parameters|change_state|manage_nodes)\b',
         'ros2\s+run\b[^;&|\n]*\bmhseals_nav\s+([^;&|\n]*\s)?run_task\b',
         'python[\d.]*\s+(-\S+\s+)*-m\s*mhseals_nav\.tasks\b',
         'python[\d.]*\s+(-\S+\s+)*-m\s*mhseals_testing\.(procedures|runner)\b',
         'ros2\s+(topic\s+pub|service\s+call)\b.*(\boperator/heartbeat|\bmhseals_testing/authority|\bthruster_pwm_node/estop|\bthrusters/)',
         'python[\d.]*(\s+-\w+)*\s+(-[A-Za-z]*c|-)\s.*\bcreate_publisher\b',
         'ros2\s+(topic\s+pub|action\s+send_goal|service\s+call|param\s+(set|load|delete)|lifecycle\s+set|run)\s+(--?[\w-]+\s+)*[^\s-]*\$',
         '\bxargs\b[^|;&\n]*\bros2\s+(topic\s+pub|action\s+send_goal|service\s+call|param\s+(set|load|delete)|lifecycle\s+set|run)\b',
         '\b(pkill|killall)\b',
         '\bxargs\s+(-\S+\s+)*(sudo\s+)?kill\b',
         '\bkill\b.*\b(command_mux|\w*watchdog|approach_guard|thruster_pwm\w*|\w*velocity_controller|mavros\w*|boat_(trial|test)\w*)\b',
         # agent_hook.SIM_ARM: the switch's env name anywhere, or a shell write to a live agent.yaml (writers,
         # a copy into it, a redirection, xargs; a worktree copy is fine, symlinks resolved; a copy *from* it is a read);
         # INTO: rsync, tar -x, git checkout/restore/apply, patch, cp -r/-a or find -delete/-exec rm into a dir that is or
         # holds a live config, launch or hook dir; a python one-liner writing a file is a writer too
         '\bMHSEALS_SIM_ARM\b',
         '(?<![\w-])(rm|mv|dd|tee|sed|perl|awk|gawk|ed|ex|vi|vim|nano|yq|patch|truncate|chmod|unlink|shred|rsync|ln|uniq|sort|tar|find(?=[^;&|\n]*\s-(delete|exec\w*|ok\w*|fprint\w*|fls)\b)|git\s+(-C\s+\S+\s+)?(checkout|restore|apply|reset|stash|mv|rm)|python[\d.]*|pytest|py\.test)(?![\w.-]).*(\bagent\.ya?ml\b)',
         '\bpython[\d.]*\s+(-\S+\s+)*(-[A-Za-z]*c\s|(-\s+)?<<)(?=.*(\b(write_\w+|unlink|remove|rename|replace|copy\w*|move|truncate|chmod|symlink_to|rmtree)\(|\bopen\([^)\n]*[,(]\s*(mode=)?[wax])).*(\bagent\.ya?ml\b)',
         '(?<![\w-])(cp|install)\b[^;&|\n]*(\bagent\.ya?ml\b)(?![^;&|\n]*\s(?!\S*(\bagent\.ya?ml\b))\S*[^/\s]\.\w+\s*($|[;&|)\n]))',
         '>\|?\s*\S*(\bagent\.ya?ml\b)',
         '(\bagent\.ya?ml\b)[^;&\n]*\|\s*xargs\b',
         '(?<![\w-])(rsync|tar|patch|git\s+(-C\s+\S+\s+)?(checkout|restore|apply)|cp(?=[^;&|\n]*\s(-[A-Za-z]*[raR][A-Za-z]*|--recursive|--archive)(?=\s))|find(?=[^;&|\n]*\s(-delete|-fprint\w*|-fls|-(exec|execdir|ok|okdir)\s+(\S*/)?(rm|rmdir|mv|sed|perl|cp|tee|truncate|chmod|shred|unlink|ln|dd|install|rsync|sh|bash)\b)))\b[^;&|\n]*',
         # agent_hook.ARMING: the thruster driver, mux or controller started by any route (run --sim-arm arms a sim);
         # reading or editing its source is development
         'ros2\s+run\b[^;&|\n]*\bmhseals_hardware\s+([^;&|\n]*\s)?(thruster_pwm_node|command_mux|calibrated_velocity_controller|thruster_test|thruster_identify)\b',
         '\bpython[\d.]*\s+(-\S+\s+)*-m\s*mhseals_hardware\.(thruster_pwm_node|command_mux|velocity_controller|identification|thruster_test)\b',
         '(\bimport\s+|\b(run_module|import_module|__import__)\(\s*)mhseals_hardware\.(thruster_pwm_node|command_mux|velocity_controller|identification|thruster_test)\b',
         '\bfrom\s+mhseals_hardware(\.(thruster_pwm_node|command_mux|velocity_controller|identification|thruster_test)\b|(\.\w+)?\s+import\b[^\n]*\b(thruster_pwm_node|command_mux|velocity_controller|identification|thruster_test)\b)',
         '(^|[;&|(`\n]|\b(exec|nohup|setsid|sudo|env|time|nice|stdbuf|xargs|strace|timeout|python[\d.]*|bash|sh|dash|zsh)\b)\s*((-\S+|\w+=\S*|\d+\w*)\s+)*(/|~/|\.{1,2}/)?([\w.-]+/)*(thruster_pwm_node|command_mux|calibrated_velocity_controller|thruster_test|thruster_identify)(\.py)?(?=\s|$|[;&|)`])',
         'ros2\s+launch\b.*\bcommand_mux:=(?!false\b|False\b)',
         'ros2\s+launch\s+(--?\S+\s+)*\S*mhseals_hardware\b',
         'ros2\s+launch\s+(--?\S+\s+)*\S*(/|\.launch\.|\.py\b|\.xml\b|\.ya?ml\b)',
         # agent_hook.HOLDS and STOP: the mux's saved holds and <data root>/agent/stop (touch it to stop); live copies
         # only; a whole agent dir only under bags/, a $VAR, ~ or bare (build/.../agent is not the data root's)
         'command_mux[\w*?\[\]-]*\.json|\bcommand_mux_\*|\bhold_store\b(?!\.py)',
         '(?<![\w-])(rm|mv|rmdir|unlink|shred|find|rsync)\b.*/mhseals(/\*?)?(?=\s|$|[;&|)])',
         '(?<![\w-])(rm|mv|unlink|shred|truncate|cp|ln|install|dd|tee|sed|perl|python[\d.]*|find|rsync|chmod|chattr|rmdir)\b.*(\bagent/stop\b|((?<![\w./~$}-])|(?<=\bbags/)|(?<=[}~]/)|\$\w+/)agent/(\*|\?|\[))',
         '>\|?\s*\S*\bagent/stop\b',
         '(?<![\w-])(rm|mv|rmdir|find|rsync)\b.*((?<![\w./~$}-])|(?<=\bbags/)|(?<=[}~]/)|\$\w+/)agent/?(?=\s|$|[;&|)])',
         '\b(cd|pushd)\s+(-\S+\s+)*\S*\bagent/?(?=\s|$|[;&|)]).*((?<![\w-])(rm|mv|unlink|shred|truncate|cp|ln|install|dd|tee|sed|perl|python[\d.]*|find|rsync|chmod|chattr)\b.*|>\|?\s*)(?<![\w/.-])(\./)?(stop\b|\*|\?|\[)',
         '\bstop_path\(\)\.(unlink|rename|replace|write_\w+|open)\b',
         # agent_hook.LAUNCHES and HOOKS: shell writes to a live launch file or the live agent hook and its wiring
         # (agent_hook.py, .agents/hook.py, .claude/settings*.json, .codex/hooks.json); worktree copies are free
         '(?<![\w-])(rm|mv|dd|tee|sed|perl|awk|gawk|ed|ex|vi|vim|nano|yq|patch|truncate|chmod|unlink|shred|rsync|ln|uniq|sort|tar|find(?=[^;&|\n]*\s-(delete|exec\w*|ok\w*|fprint\w*|fls)\b)|git\s+(-C\s+\S+\s+)?(checkout|restore|apply|reset|stash|mv|rm))(?![\w.-])[^;&|\n]*((?:(?<=/)|(?<![^\s;&|<>()=]))launch/[^\s;&|<>()/]+\.(?:py|xml|ya?ml)\b|[^\s;&|<>()=/]\.launch\.(?:py|xml|ya?ml)\b)',
         '\bpython[\d.]*\s+(-\S+\s+)*(-[A-Za-z]*c\s|(-\s+)?<<)(?=.*(\b(write_\w+|unlink|remove|rename|replace|copy\w*|move|truncate|chmod|symlink_to|rmtree)\(|\bopen\([^)\n]*[,(]\s*(mode=)?[wax])).*((?:(?<=/)|(?<![^\s;&|<>()=]))launch/[^\s;&|<>()/]+\.(?:py|xml|ya?ml)\b|[^\s;&|<>()=/]\.launch\.(?:py|xml|ya?ml)\b)',
         '(?<![\w-])(cp|install)\b[^;&|\n]*((?:(?<=/)|(?<![^\s;&|<>()=]))launch/[^\s;&|<>()/]+\.(?:py|xml|ya?ml)\b|[^\s;&|<>()=/]\.launch\.(?:py|xml|ya?ml)\b)(?![^;&|\n]*\s(?!\S*((?:(?<=/)|(?<![^\s;&|<>()=]))launch/[^\s;&|<>()/]+\.(?:py|xml|ya?ml)\b|[^\s;&|<>()=/]\.launch\.(?:py|xml|ya?ml)\b))\S*[^/\s]\.\w+\s*($|[;&|)\n]))',
         '>\|?\s*\S*((?:(?<=/)|(?<![^\s;&|<>()=]))launch/[^\s;&|<>()/]+\.(?:py|xml|ya?ml)\b|[^\s;&|<>()=/]\.launch\.(?:py|xml|ya?ml)\b)',
         '((?:(?<=/)|(?<![^\s;&|<>()=]))launch/[^\s;&|<>()/]+\.(?:py|xml|ya?ml)\b|[^\s;&|<>()=/]\.launch\.(?:py|xml|ya?ml)\b)[^;&\n]*\|\s*xargs\b',
         '(?<![\w-])(rm|mv|dd|tee|sed|perl|awk|gawk|ed|ex|vi|vim|nano|yq|patch|truncate|chmod|unlink|shred|rsync|ln|uniq|sort|tar|find(?=[^;&|\n]*\s-(delete|exec\w*|ok\w*|fprint\w*|fls)\b)|git\s+(-C\s+\S+\s+)?(checkout|restore|apply|reset|stash|mv|rm))(?![\w.-])[^;&|\n]*((?:(?<=/)|(?<![^\s;&|<>()=]))(?:agent_hook\.py|\.agents/hook\.py|\.claude/settings(?:\.local)?\.json|\.codex/hooks\.json)(?![\w.-]))',
         '\bpython[\d.]*\s+(-\S+\s+)*(-[A-Za-z]*c\s|(-\s+)?<<)(?=.*(\b(write_\w+|unlink|remove|rename|replace|copy\w*|move|truncate|chmod|symlink_to|rmtree)\(|\bopen\([^)\n]*[,(]\s*(mode=)?[wax])).*((?:(?<=/)|(?<![^\s;&|<>()=]))(?:agent_hook\.py|\.agents/hook\.py|\.claude/settings(?:\.local)?\.json|\.codex/hooks\.json)(?![\w.-]))',
         '(?<![\w-])(cp|install)\b[^;&|\n]*((?:(?<=/)|(?<![^\s;&|<>()=]))(?:agent_hook\.py|\.agents/hook\.py|\.claude/settings(?:\.local)?\.json|\.codex/hooks\.json)(?![\w.-]))(?![^;&|\n]*\s(?!\S*((?:(?<=/)|(?<![^\s;&|<>()=]))(?:agent_hook\.py|\.agents/hook\.py|\.claude/settings(?:\.local)?\.json|\.codex/hooks\.json)(?![\w.-])))\S*[^/\s]\.\w+\s*($|[;&|)\n]))',
         '>\|?\s*\S*((?:(?<=/)|(?<![^\s;&|<>()=]))(?:agent_hook\.py|\.agents/hook\.py|\.claude/settings(?:\.local)?\.json|\.codex/hooks\.json)(?![\w.-]))',
         '((?:(?<=/)|(?<![^\s;&|<>()=]))(?:agent_hook\.py|\.agents/hook\.py|\.claude/settings(?:\.local)?\.json|\.codex/hooks\.json)(?![\w.-]))[^;&\n]*\|\s*xargs\b',
         # agent_hook.EDITS: the Edit/Write/NotebookEdit and apply_patch tools, one line per file:
         # EDIT create|change|delete live|dev <path>. dev: in a linked git worktree and not ignored (develop there);
         # live: the main checkouts, install/, data and runtime dirs. Live agent.yaml, holds, an existing stop, launch
         # files, the agent hook and its wiring.
         '(?m)^EDIT \w+ live [^\n]*/agent\.ya?ml$',
         '(?m)^EDIT \w+ live [^\n]*(/command_mux[^/\n]*\.json$|/hold_store(/|$|\.json$)|/mhseals(/|$))',
         '(?m)^EDIT (change|delete) live [^\n]*/agent/stop$',
         '(?m)^EDIT \w+ live [^\n]*(/launch/[^/\n]+\.(py|xml|ya?ml)|[^/\n]\.launch\.(py|xml|ya?ml))$',
         '(?m)^EDIT \w+ live [^\n]*/(agent_hook\.py|\.agents/hook\.py|\.claude/settings(\.local)?\.json|\.codex/hooks\.json)$']
  hosts: [blastoise-odroid, blastoise-jetson, squirtle-jetson]
  deny_boat: ['\b(pkill|killall|kill)\b', '\b(docker|podman)\b.*\s(stop|kill|restart|rm|down|pause)\b',
              '\bsystemctl\s+(--user\s+)?(stop|kill|restart|isolate|reboot|poweroff|halt)\b',
              '\b(reboot|poweroff|halt|shutdown)\b', '\b(tel)?init\s+[0-6sS]\b', '\bloginctl\s+(terminate|kill)', 'sysrq']
