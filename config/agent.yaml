# Agent control (boat_trial claim/run/goal/... and the agent hook for Claude Code and Codex). Hot reloaded.
# lease.idle_s: any verb or hook note by the claim's `who` renews it; motion_s: the blocking CLI of
# a running act renews it every motion_s/3. Expiry acts exactly like E: neutral, mux hold, goal
# cancelled. max_claim_s ends a claim that keeps renewing.
schema: mhseals.agent_config/1
lease: {idle_s: 120, motion_s: 10, max_claim_s: 3600}
request_s: 5            # a request past this is answered expired; never replayed after a restart
confirm_s: 30           # human confirm popup; timeout = refused
ask_s: 120
run: [square, station, nav2_bringup, controller_check, perception, mission]   # procedure keys agents may request
unclaimed_driver: warn  # warn | hold: hold asks for a mux hold when an unclaimed /cmd_vel drives >1 s while armed
hook:
  target: blastoise
  path: /var/home/roboboat/astro_dock/bags/agent/channel.jsonl
  match: ['\bssh\s+(-\S+\s+)*(blastoise|squirtle)\b', '\bros2\b', '\bdocker\s+exec\b']
  skip: ['\bboat_(trial|agent)\b']
  max_per_10s: 6
  deny: ['ros2\s+topic\s+pub\b.*(/cmd_vel|/command_mux|/goal_pose|/mavros/(rc/override|setpoint))',
         'ros2\s+action\s+send_goal\b.*(navigate|/(spin|backup|drive_on_heading|follow_waypoints)\b)',
         'ros2\s+service\s+call\b.*/mavros/(cmd/(arming|command)|set_mode|param)',
         'ros2\s+param\s+set\s+\S*mavros',
         '\b(pkill|killall)\b']
