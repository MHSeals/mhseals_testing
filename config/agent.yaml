# Agent control (boat_trial claim/run/goal/... and the agent hook for Claude Code and Codex). Hot reloaded.
# lease.idle_s: any verb or hook note by the claim's `who` renews it; motion_s: the blocking CLI of
# a running act renews it every motion_s/3. Expiry acts exactly like E: neutral, mux hold, goal
# cancelled; an idle lapse while disarmed and neutral ends the claim quietly, no hold (owner decision 2026-11-01).
# max_claim_s ends a claim that keeps renewing.
schema: mhseals.agent_config/1
lease: {idle_s: 600, motion_s: 10, max_claim_s: 3600}
# boat_agent release HOLD --why (owner decision 2026-11-01): a lease or watchdog hold once its fault cleared; an
# operator hold (Space, stop, manual, an agent's own stop) only with a grant in this file (harness/agent_grants.py);
# the e-stop never.
grants: ~/.config/mhseals/agent_grants.yaml
request_s: 5            # a request past this is answered expired; never replayed after a restart
confirm_s: 30           # human confirm popup; timeout = refused
ask_s: 120
# owner decisions 2026-11-01: an agent runs characterization (thrust_physics: B3 pulses, survey, maneuvers; and
# characterize, f, with C applied live and read back) after the operator positions the boat; arming is through
# boat_agent arm (a countdown the operator cancels), the operator answers Ready, holds and gates are unchanged
run: [square, station, nav2_bringup, controller_check, perception, mission, characterize, thrust_physics]   # procedure keys agents may request
# component keys agents may start and stop (boat_agent start/stop COMPONENT --claim ID), through the Status row's
# own path, no popup, the row saying "by agent W" (owner decision 2026-10-31). Never the thruster driver, the mux,
# the controller, the operator heartbeat, the watchdogs or a commander part (Nav2, the mission runner), listed or not.
start: [odometry, ekf, sensors, camera, objects]
# settings agents may set (owner decision 2026-11-01), as the operator's Settings change does, shown and journaled
# "agent W set KEY=VALUE": `run KEY --set K=V` (that procedure's list and `any`, applied before the run starts,
# refused while a procedure runs) and `set K=V --claim ID` (every key listed here, refused while armed or running).
# Only settings with fixed choices (or on/off), within them. Never amplitude, timings, repeats, navigation extents,
# the command mode, the bench override, staleness or the agent controls (agent_config.SETTINGS_NEVER), listed or not.
settings:
  thrust_physics: [thrust_step]
  dock_physics: [dock_step]
  any: [auto_tab]
# boat_agent fcu (owner decision 2026-10-31): agents read FCU parameters, set the ones `set:` lists (globs) and restart
# the FCU, claimed and disarmed, through the TUI's MAVROS link. Never the yaw source, compass, servos, RC, arming,
# failsafes, fences or safety switch (agent_fcu.NEVER), listed or not. The first write of a TUI session snapshots
# every parameter to `store`; each write is read back and logged there (fcu_changes.md, fcu_agent_changes.jsonl).
fcu:
  store: ~/.claude/plans/boat
  set: [SCHED_LOOP_RATE, 'SR0_*', 'SR1_*', INS_GYRO_FILTER, INS_ACCEL_FILTER, INS_GYRO_RATE, INS_FAST_SAMPLE]
  values: {SCHED_LOOP_RATE: [50, 100, 200, 400]}
  # SCHED_LOOP_RATE above `after` only once a `fcu rates` check by this TUI, after an FCU restart that followed the
  # last SCHED_LOOP_RATE write, ran at `after` (IMU above half of it) with the FCU load below this
  loop_400: {after: 200, max_load_pct: 60}
  rates:
    window_s: 10
    topics: {/imu/raw: sensor_msgs/msg/Imu, /odom/local: nav_msgs/msg/Odometry}
# boat_agent arm --claim ID (owner decision 2026-11-01): a banner counts down this long in the TUI, the operator
# cancels it (Esc, Enter); the e-stop refuses. It never releases a hold.
arm: {countdown: 5}
unclaimed_driver: warn  # warn | hold: hold asks for a mux hold when an unclaimed /cmd_vel drives >1 s while armed
# Sim-only auto-arm (owner decision 2026-10-26): `run KEY --sim-arm` arms for that run when every check of
# harness/sim_arm.py proves a sim (sim profile and clock, crane player, private domain in `domains`, never 42,
# localhost discovery, private-IPC container, no real-hardware node in `real_nodes`, the session's empty hold
# file, no <data root>/agent/stop). It never releases a hold and disarms when the run ends, after max_s, on a
# lapsed lease, when the stop file appears or when the graph re-check (every 5 s) stops proving a sim. A fresh sim
# session clears holds a previous session left in its own hold file; a --sim-arm run's Ready prompts are the agent's.
# This file is the boat's too, so it ships off. The sim container turns it on: `docker run -e MHSEALS_SIM_ARM=1`
# (crane_autodemo, roboboat_test); the boat's containers never set it. enabled: true here also turns it on.
sim_arm:
  enabled: false
  max_s: 1800
  domains: [101, 232]
  real_nodes: ['mavros\w*', 'zed_\w+', 'velodyne\w*', lidar_relay_publish, fcu_watchdog, host_diagnostic, 'ntrip\w*',
               'ublox\w*', thruster_pwm_node, command_mux]
hook:
  # local: notes go to this machine's channel (the sim/dev TUI), never over ssh. A boat session names its host
  # (BOAT_AGENT_TARGET=blastoise-odroid in the agent's environment, or here); only then do they go to path there.
  # `blastoise` still works for one release; it means blastoise-odroid.
  target: local
  path: /var/home/roboboat/astro_dock/bags/agent/channel.jsonl
  match: ['\bssh\s+(-\S+\s+)*(blastoise(-odroid|-jetson)?|squirtle(-jetson)?)\b', '\bros2\b', '\bdocker\s+exec\b']
  skip: ['\bboat_(trial|agent)\b']
  max_per_10s: 6
  # Owner decision 2026-11-01: the hook matches what a call runs, never its text. Each command of each pipeline
  # ($(...), <(...), bash -c, su -c, tmux new, wrappers such as sudo, timeout or docker exec, and the remote
  # command of ssh HOST ...) is one line, its argv joined with the program by base name; each file it writes
  # (redirections, rm, mv, cp, tee, sed -i, dd of= ...) is one line `EDIT create|change|delete live|dev PATH` (dev:
  # a linked git worktree). A pattern matches a line from its start. Heredoc bodies, quoted text and the arguments
  # of grep, echo or git commit are data. deny_boat applies when the line runs on a boat: this host is one, or ssh
  # (and kin) reaches one: hosts, their vessel names, the STATIC_LEASES of ASTRO_NETWORK_ENV or an ~/.ssh/config
  # alias. Advisory: variables and scripts get through; the mux and the claim are the safety.
  # Kept: raw motion, MAVROS arming/mode/params, the operator heartbeat and e-stop, bags with motion topics,
  # starting the driver, mux, mission runner or a procedure directly, pkill/killall (kill PID instead), the mux's
  # saved holds, changing the stop file, the live agent hook and its wiring (src/*/hooks/hook.py too) and
  # core.hooksPath. Nav2 params pass with a claim (BOAT_AGENT_CLAIM=ID ros2 param set ...); lifecycles do not.
  deny: ['ros2\s+topic\s+pub\b.*(\bcmd_vel|\bcommand_mux\b|\bgoal_pose|\bmavros/(rc/override|setpoint|manual_control))',
         'ros2\s+action\s+send_goal\b.*(navigate|(?<![\w-])(spin|backup|drive_on_heading|follow_waypoints|follow_gps_waypoints|follow_path|dock_robot|undock_robot|assisted_teleop)\b)',
         'ros2\s+service\s+call\b.*\bmavros/(cmd/(arming|command)|set_mode|param/(set|push|load))',
         'ros2\s+(param\s+(set|load|delete)|lifecycle\s+set)\b.*\b(mavros|command_mux|\w*watchdog|approach_guard|thruster_pwm\w*|\w*velocity_controller)\b',
         'ros2\s+service\s+call\b.*\b(mavros\w*|command_mux|\w*watchdog|approach_guard|thruster_pwm\w*|\w*velocity_controller)/(set_parameters\w*|load_parameters|change_state)\b',
         'ros2\s+bag\s+play\b(?!.*--topics\b)',
         'ros2\s+bag\s+play\b.*--topics\b.*(cmd_vel|thrusters?\b|thruster_|command_mux|mavros/(rc/override|setpoint|manual_control))',
         'ros2\s+run\b.*?\smavros\s+(\S+\s+)*?mav\w*\b',
         'ros2\s+run\b.*\steleop_twist_\w+\b',
         'ros2\s+run\b.*?\smhseals_hardware\s+(\S+\s+)*?keyboard_control\b',
         'ros2\s+run\b.*?\smhseals_testing\s+(\S+\s+)*?operator_heartbeat\b|python[\d.]*\s+(-\S+\s+)*-m\s*mhseals_testing\.ros\.operator_heartbeat\b',
         'operator_heartbeat(\.py)?(\s|$)|python[\d.]*\s+(-\S+\s+)*(\S*/)?operator_heartbeat(\.py)?(\s|$)',
         'ros2\s+(topic\s+pub|service\s+call)\b.*\bthruster_pwm_node/test_pulses\b',
         'ros2\s+param\s+(set|load|delete)\b.*\b(controller_server|planner_server|bt_navigator|behavior_server|smoother_server|velocity_smoother|collision_monitor|waypoint_follower|route_server|docking_server|lifecycle_manager\w*)\b',
         'ros2\s+lifecycle\s+set\b.*\b(controller_server|planner_server|bt_navigator|behavior_server|smoother_server|velocity_smoother|collision_monitor|waypoint_follower|route_server|docking_server|lifecycle_manager\w*)\b',
         'ros2\s+service\s+call\b.*\b(controller_server|planner_server|bt_navigator|behavior_server|smoother_server|velocity_smoother|collision_monitor|waypoint_follower|route_server|docking_server|lifecycle_manager\w*)/(set_parameters\w*|load_parameters|change_state|manage_nodes)\b',
         'ros2\s+run\b.*?\smhseals_nav\s+(\S+\s+)*?run_task\b',
         'python[\d.]*\s+(-\S+\s+)*-m\s*mhseals_nav\.tasks\b',
         'python[\d.]*\s+(-\S+\s+)*-m\s*mhseals_testing\.(procedures|runner)\b',
         'ros2\s+(topic\s+pub|service\s+call)\b.*(\boperator/heartbeat|\bmhseals_testing/authority|\bthruster_pwm_node/estop|\bthrusters/)',
         'ros2\s+(topic\s+pub|action\s+send_goal|service\s+call|param\s+(set|load|delete)|lifecycle\s+set|run)\s+(--?[\w-]+\s+)*[^\s-]*\$',
         'xargs\b.*\sros2\s+(topic\s+pub|action\s+send_goal|service\s+call|param\s+(set|load|delete)|lifecycle\s+set|run)\b',
         '(pkill|killall)\b',
         'xargs\b.*\s(sudo\s+)?kill\b',
         '(kill|pkill|killall)\b.*\b(command_mux|\w*watchdog|approach_guard|thruster_pwm\w*|\w*velocity_controller|mavros\w*|boat_(trial|test)\w*)\b',
         'ros2\s+run\b.*?\smhseals_hardware\s+(\S+\s+)*?(thruster_pwm_node|command_mux|calibrated_velocity_controller|thruster_test|thruster_identify)\b',
         'python[\d.]*\s+(-\S+\s+)*-m\s*mhseals_hardware\.(thruster_pwm_node|command_mux|velocity_controller|identification|thruster_test)\b',
         '(thruster_pwm_node|command_mux|calibrated_velocity_controller|thruster_test|thruster_identify)(\.py)?(\s|$)|python[\d.]*\s+(-\S+\s+)*(\S*/)?(thruster_pwm_node|command_mux|calibrated_velocity_controller|thruster_test|thruster_identify)(\.py)?(\s|$)',
         'ros2\s+launch\b.*\bcommand_mux:=(?!false\b|False\b)',
         'ros2\s+launch\s+(--?\S+\s+)*\S*mhseals_hardware\b',
         'ros2\s+launch\s+(--?\S+\s+)*\S*(/|\.launch\.|\.py\b|\.xml\b|\.ya?ml\b)',
         'EDIT \w+ live .*(/command_mux[^/]*(\.json|\*)|/hold_store(/.*)?|/hold_store\.json)$',
         'EDIT (change|delete) live .*/agent/stop$',
         'EDIT \w+ live .*/(agent_hook\.py|\.agents/hook\.py|src/[^/]+/hooks/hook\.py|\.claude/settings(\.local)?\.json|\.codex/hooks\.json)$',
         '(?i)git\b(?!.*\sconfig\s+(--get\S*|--list|-l)\s).*\bcore\.hookspath\b',
         '(?i)\w+=.*\bcore\.hookspath\b']
  hosts: [blastoise-odroid, blastoise-jetson, squirtle-jetson]
  # deny_boat: a component started or stopped by hand (boat_agent start/stop COMPONENT --claim ID does it), kills,
  # container, unit and power changes, keys into the boat TUI (tmux -L boat) and its runtime config and launch files.
  deny_boat: ['ros2\s+launch\s+(--?\S+\s+)*mhseals_(nav|hardware)\b',
              'systemctl\s+(--user\s+)?(start|restart)\s+(\S+\s+)*mhseals-',
              'systemctl\s+(--user\s+)?(stop|kill)\s+(\S+\s+)*mhseals-',
              '(pkill|killall|kill)\b|tmux\b.*\skill-(server|session|window|pane)\b',
              '(docker|podman)\b.*\s(stop|kill|restart|rm|down|pause)\b',
              'systemctl\s+(--user\s+)?(stop|kill|restart|isolate|reboot|poweroff|halt)\b',
              '(reboot|poweroff|halt|shutdown)\b',
              '(tel)?init\s+[0-6sS]\b',
              'loginctl\s+(terminate|kill)',
              'EDIT \w+ \w+ .*sysrq',
              'tmux\b.*(-L\s*boat\b|-S\s*\S*/tmux-\d+/boat\b).*\s(send-keys|send|paste-buffer|pasteb|load-buffer|loadb|pipe-pane|pipep)(\s|$)',
              'EDIT \w+ live .*(/agent\.ya?ml|/launch/[^/]+\.(py|xml|ya?ml)|[^/]\.launch\.(py|xml|ya?ml))$']
