# Agent control (boat_trial claim/run/goal/... and the agent hook for Claude Code and Codex). Hot reloaded.
# lease.idle_s: any verb or hook note by the claim's `who` renews it; motion_s: the blocking CLI of
# a running act renews it every motion_s/3. Expiry acts exactly like E: neutral, mux hold, goal
# cancelled. max_claim_s ends a claim that keeps renewing.
schema: mhseals.agent_config/1
lease: {idle_s: 120, motion_s: 10, max_claim_s: 3600}
request_s: 5            # a request past this is answered expired; never replayed after a restart
confirm_s: 30           # human confirm popup; timeout = refused
ask_s: 120
run: [square, station, nav2_bringup, controller_check, perception, mission]   # procedure keys agents may request
unclaimed_driver: warn  # warn | hold: hold asks for a mux hold when an unclaimed /cmd_vel drives >1 s while armed
hook:
  # local: notes go to this machine's channel (the sim/dev TUI), never over ssh. A boat session names its host
  # (BOAT_AGENT_TARGET=blastoise-odroid in the agent's environment, or here); only then do they go to path there.
  # `blastoise` still works for one release; it means blastoise-odroid.
  target: local
  path: /var/home/roboboat/astro_dock/bags/agent/channel.jsonl
  match: ['\bssh\s+(-\S+\s+)*(blastoise(-odroid|-jetson)?|squirtle(-jetson)?)\b', '\bros2\b', '\bdocker\s+exec\b']
  skip: ['\bboat_(trial|agent)\b']
  max_per_10s: 6
  # Two tiers. A call whose every command only reads, searches or prints text (grep, rg, echo, printf, cat,
  # head, tail, less, wc, sed -n with p and s/// only, git commit/log/diff/show/status, pytest), with no $(...),
  # backticks, <(...) and no file written, is never denied: a grep pattern or a commit message is data (write
  # files with the agent's Write/Edit tools, not the shell). Anything else is denied when a deny pattern is
  # found anywhere in its whole text (quotes dropped, across lines), or deny_boat when the text names a boat:
  # hosts (ssh host names, one per computer) and their vessel names (blastoise, squirtle: the former aliases),
  # the STATIC_LEASES hostnames and addresses of the vessel's network env (ASTRO_NETWORK_ENV), or an
  # ~/.ssh/config alias for them. Names match with or without the leading slash. Advisory: run-time strings and scripts from earlier
  # calls still get through, and so does /mavros/mission/push (a waypoint upload; the FCU drives nothing here):
  # noted in the TUI, not denied. ros2 bag play needs --topics without motion topics (cmd_vel*, thrusters, the
  # mux, MAVROS RC/setpoints). A ros2 write whose target is a $variable is denied: the hook cannot read it.
  # pkill and killall are denied (kill your own processes by exact PID); so is killing the boat's control, and
  # on a boat killing anything, stopping its containers or units and rebooting it: use boat_agent stop.
  deny: ['ros2\s+topic\s+pub\b.*(\bcmd_vel|\bcommand_mux\b|\bgoal_pose|\bmavros/(rc/override|setpoint|manual_control))',
         'ros2\s+action\s+send_goal\b.*(navigate|(?<![\w-])(spin|backup|drive_on_heading|follow_waypoints|follow_gps_waypoints|follow_path|dock_robot|undock_robot|assisted_teleop)\b)',
         'ros2\s+service\s+call\b.*\bmavros/(cmd/(arming|command)|set_mode|param/(set|push|load))',
         'ros2\s+(param\s+(set|load|delete)|lifecycle\s+set)\b.*\b(mavros|command_mux|\w*watchdog|approach_guard|thruster_pwm\w*|\w*velocity_controller)\b',
         'ros2\s+service\s+call\b.*\b(mavros\w*|command_mux|\w*watchdog|approach_guard|thruster_pwm\w*|\w*velocity_controller)/(set_parameters\w*|load_parameters|change_state)\b',
         'ros2\s+bag\s+play\b(?!.*--topics\b)',
         'ros2\s+bag\s+play\b.*--topics\b.*(cmd_vel|thrusters?\b|thruster_|command_mux|mavros/(rc/override|setpoint|manual_control))',
         'ros2\s+run\s+(mavros\s+mav\w*|teleop_twist_\w+|mhseals_hardware\s+keyboard_control)\b',
         'ros2\s+(topic\s+pub|service\s+call)\b.*(\boperator/heartbeat|\bmhseals_testing/authority|\bthruster_pwm_node/estop|\bthrusters/)',
         'python[\d.]*(\s+-\w+)*\s+(-[A-Za-z]*c|-)\s.*\bcreate_publisher\b',
         'ros2\s+(topic\s+pub|action\s+send_goal|service\s+call|param\s+(set|load|delete)|lifecycle\s+set|run)\s+(--?[\w-]+\s+)*[^\s-]*\$',
         '\bxargs\b[^|;&\n]*\bros2\s+(topic\s+pub|action\s+send_goal|service\s+call|param\s+(set|load|delete)|lifecycle\s+set|run)\b',
         '\b(pkill|killall)\b', '\bxargs\s+(-\S+\s+)*(sudo\s+)?kill\b',
         '\bkill\b.*\b(command_mux|\w*watchdog|approach_guard|thruster_pwm\w*|\w*velocity_controller|mavros\w*|boat_(trial|test)\w*)\b']
  hosts: [blastoise-odroid, blastoise-jetson, squirtle-jetson]
  deny_boat: ['\b(pkill|killall|kill)\b', '\b(docker|podman)\b.*\s(stop|kill|restart|rm|down|pause)\b',
              '\bsystemctl\s+(--user\s+)?(stop|kill|restart|isolate|reboot|poweroff|halt)\b',
              '\b(reboot|poweroff|halt|shutdown)\b', '\b(tel)?init\s+[0-6sS]\b', '\bloginctl\s+(terminate|kill)', 'sysrq']
