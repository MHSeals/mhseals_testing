# Lean recorder profile (master section 4). The odometry group includes /odom/gps and
# /odom/global: nav.map_rotation reads /odom/gps against enu(/gps/fix) and falls back to
# the first /odom/global pose, and no field bag so far carries either topic.
lean:
  topics:
    - /tf
    - /tf_static
    - /rosout
    - /diagnostics
    - /cmd_vel
    - /cmd_vel/manual
    - /cmd_vel/applied
    - /cmd_vel_effort
    - /command_mux/state
    - /command_mux/request
    - /mhseals_testing/authority
    - /thrusters/pwm
    - /odom/local
    - /odom/global
    - /odom/mavros
    - /odom/gps
    - /imu/raw
    - /gps/fix
    - /mavros/state
    - /mavros/imu/data
    - /mavros/imu/mag
    - /mavros/rc/in
    - /mavros/battery
    - /fcu/ekf_status
    - /mavros/global_position/raw/fix
    - /mavros/global_position/raw/gps_vel
    - /mavros/gpsstatus/gps1/raw
    - /mhseals_testing/rtk/status  # legacy bags: DiagnosticArray; keep the name, readers dispatch on type
    - /plan
    - /local_plan
    - /navigate_to_pose/_action/status
    - /task/status
    - /task/events
    - /objects/map
    - /detections
    - /perception/status
    - /mhseals_testing/minimap/costmap
  regex: '^/(mhseals_testing|thrusters)/.*'  # the -e include regex, not an exclude
# Per-profile additions merged into either mode (bags.md section 2); the map truth golden needs /crane/odom.
extra:
  crane_full_stack:
    topics:
      - /clock
      - /crane/odom
# Send targets (bags.md section 7). Give hosts by mDNS name; an empty host means a local path (tests).
transfer:
  targets:
    - {name: tranquility, host: tranquility.local, user: peace, path: astro_dock/bags}
  bwlimit_kbps: 0
