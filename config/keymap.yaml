# boat_test keymap (prototype of mhseals_testing/config/keymap.yaml).  One file for every spec.
#
# Contexts
#   layered:  global → tab.<drive|correction|map|bags|fusion> → panel.<name> | view.minimap
#             review: global → review → review.activity (Drive) | tab.map → view.minimap (Map)
#   modal:    manual, runner, minimap.goal, popup.<name>: own bindings + `passthrough` actions only
# `override:` in a layered child lists the ancestor actions it shadows on purpose.
# Key names are KeyReader's (case-sensitive after K1).  Labels and hint priority live in ui/actions.py.
schema: mhseals.keymap/1

# Fixed keys: no context may bind them to anything else and no overlay may move them (keymap rule 8).
# The code names them keymap.STOP_KEY and keymap.REVOKE_KEY, so every modal loop (popups.popup, the arm
# waits, manual, the hold confirm) handles them before its own keys.
fixed:
  - {key: space, action: stop, also: [abort],
     why: 'Space is the stop in every screen and modal: the key anyone reaches for, so a rebind or a popup can never leave the boat without it'}
  - {key: E, action: revoke_agent, also: [revoke_selected],
     why: 'E revokes the agent''s claim from any screen with no confirm (Authority revokes its selected claim)'}

global:
  stop: [space]                 # locked; neutral + keys hold, aborts our run, cancels our goals, suspends claims
  quit: [q]                     # locked
  arm: [a]
  help: ['?']
  report: [x]
  odometry: [o]                 # the Pose popup: EKF estimates, sources, Restart EKFs
  health: ['!']
  history: [H]                  # config history popup
  camera: [V]                   # perception popup with View open
  release_hold: [U]             # confirm names who resumes; refused while the RC switch is HOLD/MANUAL
  revoke_agent: [E]             # no confirm; locked while Agents = allow
  take_control: [O]             # a viewer takes control (confirm); the owner keeps it
  operator_state: [S]           # normal, manual, battery swap, power cycle: agents pause; m sets manual
  mark: [b]                     # instant; a digit within a moment tags it (config/annotate.yaml)
  mark_note: [B]
  bad_data: [N]                 # bad data from here; N again ends it
  say: ['"']                    # the operator's instruction, with the pose; a digit picks the words
  labels: [L]                   # the Labels tab: review marks and segments, set the water conditions
  tab_prev: ['[']
  tab_next: [']']
  focus_next: [tab]
  focus_prev: [backtab]
  focus_left: [ctrl-h, ctrl-left]
  focus_down: [ctrl-j, ctrl-down]
  focus_up: [ctrl-k, ctrl-up]
  focus_right: [ctrl-l, ctrl-right]
  up: [up, k]
  down: [down, j]
  activate: [enter]
  back: [escape]
  amplitude_up: ['+', '=']
  amplitude_down: ['-', '_']
  checklist: [W]                # boat_tui preview's checklist panel: check on/off (p pass, f fail, n note)

# -- tabs ----------------------------------------------------------------------------
tab.drive:                      # procedure letters exist only here
  characterize: [f]
  dock_physics: [d]
  thrust_physics: [y]
  magcal: [g]
  controller_check: [v]
  manual: [m]
  thruster_set: [i]
  nav2_bringup: [n]
  square: [w]
  station: [s]
  mission: [t]
  perception: [p]
  interference: [e]             # not on a focused minimap, Drive or Map (e centres), or status (Nav2 popup)

tab.correction:
  column_prev: [left, h]
  column_next: [right, l]
  rerun_direction: [r]
  run_all: [R]
  apply_pending: [A]
  hardware_changed: [I]

tab.map:                        # view.minimap is the focused child; w g are Drive procedures elsewhere
  override: [goto]              # g rings over review's goto on the Map tab
  layer_wake: [w]
  layer_rings: [g]
  layer_tasks: [T]              # mission task hypotheses and the goal; Map tab only like w g

tab.bags:
  pin: [p]
  title: [n]
  delete: [d]
  prune: [P]
  send: [y]
  finalize: [F]

tab.fusion:
  camera_image: [i]             # the camera frame under the points and boxes (image tiers)

tab.labels:                     # review edits wait for disarmed; the conditions rows never do
  override: [activate]          # Enter replays a closed session from the item
  scale_down: [left, h]         # conditions rows: wind, waves, current 0-3
  scale_up: [right, l]
  accept: [y]
  reject: [r]
  tag: ['1', '2', '3', '4', '5', '6', '7', '8', '9']   # a mark's tag; a said item's outcome
  note_label: [n]
  split: [s]
  merge: [m]
  undo: [u]
  replay: [enter]
  session_prev: ['<']
  session_next: ['>']

# -- panels (Drive) ------------------------------------------------------------------
panel.status:
  adjust_down: [left]           # setting rows only (h and l are not, as in actions/settings.py)
  adjust_up: [right]
  override: [interference]
  params: [e]                   # Navigation → Nav2 popup

panel.motion: {}
panel.conditions: {}            # Enter → popup.conditions

panel.thrusters:
  override: [station]           # s = save here
  pulse_down: [left, h]
  pulse_up: [right, l]
  neutral: ['0']
  wire_1: ['1']
  wire_2: ['2']
  wire_3: ['3']
  wire_4: ['4']
  reverse: [r]
  save: [s]
  undo: [u]
  clear_decoupling: [c]
  pin: [P]                      # the row's J2 PWM pin, a draft like 1-4 (p stays Perception)
  pins: [M]

panel.procedures:
  fold: [left, h]               # procedure row: fold settings · setting row: step down
  unfold: [right, l]            # procedure row: unfold settings · setting row: step up

panel.activity:
  view_prev: [left, h]          # v cycles results · log · agent (agent: while the AgentDesk runs)
  view_next: [right, l]
  zoom: [z]                     # fit · 30m · 10m · 2m
  exclude: [X]

view.minimap:                   # Map tab, and the Drive minimap column at ≥150 cols
  override: [interference, dock_physics, thrust_physics]  # e centres, d detections, y trail: a focused minimap starts none
  layer_costmap: [c]
  costmap_source: [C]
  layer_hits: [r]
  layer_detections: [d]
  detection_floor: [D]
  trail_mode: [y]
  trail_restart: [Y]
  layer_fov: [F]
  course: [K]
  up_mode: [u]
  zoom_in: [z]
  zoom_out: [Z]
  zoom_fit: ['0']
  centre: [e]
  goal_mode: [G]
  cancel_goal: [X]

# -- review --------------------------------------------------------------------------
review:
  override: [back]
  play: [p]
  seek_back: [left, h]          # 5 s
  seek_fwd: [right, l]
  seek_back_big: [shift-left, '{']   # 30 s ({ } because H is history everywhere)
  seek_fwd_big: [shift-right, '}']
  jump_prev: [',']
  jump_next: ['.']
  rate_down: ['<']
  rate_up: ['>']
  goto: [g]
  leave: [escape]

review.activity:
  zoom: [z]                     # loupe 12m · 30m · 2m

# -- modal ---------------------------------------------------------------------------
manual:
  passthrough: [mark, revoke_agent, release_hold]
  surge_fwd: [w, up]
  surge_back: [s, down]
  sway_left: [a]
  sway_right: [d]
  yaw_left: [left]
  yaw_right: [right]
  speed_up: ['+', '=']
  speed_down: ['-', '_']
  stop: [space, focus-out]
  leave: [m, escape, x]

runner:
  passthrough: [mark, revoke_agent, release_hold]
  abort: [space, q, escape]

minimap.goal:
  passthrough: [stop, mark, revoke_agent]
  cursor_up: [up, k]
  cursor_down: [down, j]
  cursor_left: [left, h]
  cursor_right: [right, l]
  cursor_up_fast: [K]
  cursor_down_fast: [J]
  cursor_left_fast: [H, shift-left]
  cursor_right_fast: [L, shift-right]
  yaw_left: [',']
  yaw_right: ['.']
  yaw_auto: ['/']
  zoom_in: [z]
  zoom_out: [Z]
  cancel_goal: [X]
  send: [enter]
  leave: [escape, G]

popup.choose:     {passthrough: [stop, revoke_agent], up: [up, k], down: [down, j], left: [left, h],
                   right: [right, l, tab], select: [enter], decline: [n], cancel: [escape, q]}
                   # decline picks Cancel/Close; a call's own shortcuts win. No key confirms but Enter or a call's shortcut.
popup.prompt:     {passthrough: [stop, revoke_agent], continue: [enter], cancel: [escape, q]}
popup.show:       {passthrough: [stop, revoke_agent], close: [any]}
popup.text:       {confirm: [enter], cancel: [escape], erase: [backspace, ctrl-h]}   # never open while anything moves
popup.help:       {passthrough: [stop, revoke_agent], up: [up, k], down: [down, j], close: [escape, q, '?']}
popup.health:     {passthrough: [stop, mark, revoke_agent], up: [up, k], down: [down, j], history: [tab],
                   mute: [m], recheck: [r], ack: [x], close: [escape, q]}
popup.odometry:   {passthrough: [stop, mark, revoke_agent], up: [up, k], down: [down, j], fold: [enter],
                   rtk_base: [r], magcal: [c], restart_ekf: [e], close: [escape]}
popup.authority:  {passthrough: [stop, mark, release_hold], up: [up, k], down: [down, j],
                   detail: [enter], revoke_selected: [E], close: [escape]}   # Enter: the config popup
popup.history:    {passthrough: [stop, mark, revoke_agent], tab_prev: ['[', left], tab_next: [']', right],
                   up: [up, k], down: [down, j], detail: [l], revert: [enter], confirm: [y], base: [d],
                   name: [n], note: [N], trials: [s], raw: [v], calibration: [c], reboot: [r],
                   filter: ['/'], close: [escape, q]}
popup.config:     {passthrough: [stop, mark, revoke_agent], up: [up, k], down: [down, j], apply: [enter],
                   restart_code: [r], close: [escape]}
popup.nav2:       {passthrough: [stop, mark, revoke_agent], up: [up, k], down: [down, j], edit: [enter],
                   step_down: [left, h], step_up: [right, l], apply: [y], discard: [u], close: [escape]}
popup.conditions: {passthrough: [stop, mark, revoke_agent], up: [up, k], down: [down, j], close: [escape, q]}
popup.run:        {passthrough: [stop, mark, history, health, revoke_agent], prev: [up, k], next: [down, j],
                   review_here: [r], exclude: [X], close: [escape, q]}
popup.transfer:   {passthrough: [stop, mark, revoke_agent], hide: [escape], cancel: [c], retry: [r]}
popup.perception: {passthrough: [stop, mark, revoke_agent], up: [up, k], down: [down, j], view: [v],
                   boxes: [d], floor: [D], rate_up: ['+', '='], rate_down: ['-', '_'], freeze: [f],
                   save: [s], source: [c], close: [escape]}
popup.power:      {passthrough: [stop, mark, revoke_agent], close: [escape, q]}
popup.magcal:     {passthrough: [stop, mark, revoke_agent], enter_heading: [enter], fit: [f],
                   interference: [i], close: [escape]}
popup.pins:       {passthrough: [stop, mark, revoke_agent], up: [up, k], down: [down, j], change_down: [left, h],
                   change_up: [right, l], edit: [enter], save: [s], close: [escape]}

popup.stop:       {passthrough: [stop, revoke_agent, release_hold], close: [escape, q, enter]}   # U through popups.popup
popup.hold:       {passthrough: [stop, revoke_agent], decline: [escape, n]}   # hold-to-confirm (popups/hold.py)
popup.arming:     {passthrough: [stop, revoke_agent], cancel: [escape]}
                   # the arm waits (actions/arm.py): the mux reply and the boat config read stop on Space;
                   # the driver start cancels on Space or Esc
popup.pins_wait:  {passthrough: [revoke_agent], stop: [space, escape]}   # the driver confirming a pins edit
popup.catalog:    {passthrough: [stop, revoke_agent], up: [up, k], down: [down, j], detail: [enter], close: [escape, q]}
popup.catalog_detail: {passthrough: [stop, revoke_agent], up: [up, k, '['], down: [down, j, ']'], close: [escape, q]}
popup.course:     {passthrough: [stop, revoke_agent], corner_add: [g], corner_here: [G], nudge_north: [n],
                   nudge_south: [s], nudge_east: [e], nudge_west: [w], step_up: ['+', '='], step_down: ['-', '_'],
                   remove: [x], up: [up], down: [down], move_up: [K], move_down: [J], on_exit: [o], apply: [y],
                   leave: [escape]}   # the course area corners (view.minimap K)

# -- help and footer hints (ui/app/help.py) ---------------------------------------------
# help: the ? popup, rows of ['[Screen ]keys', text]; the screen picks a keymap stack (keymap.HELP_SCREENS).
# A third string puts the row in README.md's key table with that text.
# hints: the footer per place (keymap.HINT_STACKS), rows of [keys, label]. keymap.validate checks that every
# key named resolves in its stack; README.md's key tables are generated from help (ui/app/help.py --readme).
# {updown} {leftright} {micro} {plusminus} {pulse_step} are filled in (ASCII where needed); {{ }} are braces.
help:
  - ['Ctrl h j k l / arrows', 'Focus the panel to the left, below, above, right', 'Move focus; Enter runs or opens the row']
  - ['Tab / Shift Tab', 'Cycle focus through the panels']
  - ['[ / ]', 'Previous / next tab: Drive, Correction, Map, Bags, Fusion']
  - ['{updown} / j k', 'Move within the focused panel']
  - ['Enter', 'Run, open or show details']
  - ['Esc', 'Back out (drops a picked-up thruster); never quits']
  - ['Space', 'Stop: hold, neutral and disarm; aborts a run', 'Stop: hold, neutral, disarm; aborts a run']
  - ['a', 'Arm panel: outputs, interlocks, arm or disarm', 'Arm panel (typed ARM on real pins)']
  - ['U', 'Release the hold (confirm names who resumes)']
  - ['E', 'Revoke the agent''s claim (stops first, no confirm)', 'Revoke the agent (stops first, no confirm)']
  - ['O', 'Take control (viewer; confirm: the owner stops at neutral, disarms, revokes the agent)', 'Take control (a viewer; the owner stops at neutral)']
  - ['S', 'Operator state: normal, manual, battery swap, power cycle (agents pause; m sets manual)']
  - ['o', 'Pose: what the EKFs fuse, and the sources']
  - ['!', 'Health checks: mute, recheck, acknowledge']
  - ['W', 'Preview checklist (boat_tui preview): check on/off; then p pass, f fail, n note, Esc']
  - ['H', 'Config history: hardware, Nav2, FCU, RTK, health, keymap']
  - ['V', 'Perception with the camera view open']
  - ['+ / -', 'Trial amplitude']
  - ['x', 'Write the session report (dismisses a toast first)']
  - ['b / B', 'Mark the moment, a digit tags it (never a popup) / a note on the last mark', 'Mark now; 1-9 within 3 s tags it (wake, gust, contact ...)']
  - ['N', 'Bad data from here; N again ends it', 'Bad data on / off']
  - ['"', 'Log what the operator said, with the pose; a digit picks the words (other words: n in Labels)', 'Log a spoken instruction (1-8 picks the words)']
  - ['L', 'Labels: review marks and segments, set wind, waves and current (L again or Esc: back)']
  - ['?', 'This help']
  - ['q', 'Quit: neutral, disarm, flush the bag', 'Quit: neutral, disarm, report, bag flush (never kill the tmux session)']
  - ['Drive f d y g e v', 'Characterize, dock / thrust physics, compass cal / interference, controller steps']
  - ['Drive m i n w s t p', 'Manual, thruster set, Nav2, square, station, mission, perception (focused-panel keys win)']
  - ['Status {leftright}', 'Change a setting row: Agents, agent motion, recording, graphics']
  - ['Status e', 'Nav2 parameters (on the Navigation row)']
  - ['Thrusters {leftright}', 'Test pulse {plusminus}{pulse_step} {micro}s on the selected thruster (armed)']
  - ['Thrusters 0', 'All test pulses back to neutral']
  - ['Thrusters Enter', 'Pick up the thruster; {updown} moves it, Enter drops it']
  - ['Thrusters 1-4 / r', 'Wire it to an output / reverse it (a draft until saved)']
  - ['Thrusters s / u', 'Save the draft to the config (the next session starts from it) / undo it']
  - ['Thrusters M', 'Edit the PWM pins and MOSFET line; saved, then the driver restarts, sysfs confirms and it stops (disarmed only; refused while armed or arming)']
  - ['Thrusters P', 'Move the thruster to another free PWM pin (a draft; s saves and reads it back)']
  - ['Thrusters i', 'Thruster set: identify outputs by pulsing each one']
  - ['Thrusters c', 'Clear the fitted decoupling (asks first)']
  - ['Activity v', 'Cycle results, event log and the agent desk (while it runs)']
  - ['Activity X', 'Exclude the selected result (asks a reason)']
  - ['Map c / C', 'Costmap layer / source: auto, local, global (also the Drive minimap)']
  - ['Map r', 'Costmap hits layer']
  - ['Map d / D', 'Detections: tracks, raw, off / confidence floor']
  - ['Map y / Y', 'Trail mode / restart the trail']
  - ['Map F / u', 'Camera field of view / north-up or heading-up']
  - ['Map z / Z / 0', 'Zoom in / out / fit']
  - ['Map w g T', 'Wake, rings and task layers (Map tab only)']
  - ['Correction {leftright}', 'Pick a direction column; Enter shows its holds']
  - ['Correction r / R', 'Rerun the column / run all (both start Characterize for now)']
  - ['Correction A', 'Apply pending corrections (runtime apply is unsupported; says so)']
  - ['Correction I', 'Hardware changed: a note, then the epoch bump (every fit goes stale)']
  - ['Bags Enter', 'Review the selected session']
  - ['Bags p / n', 'Pin / title the session']
  - ['Bags d / P', 'Delete the session / prune old ones']
  - ['Bags F', 'Finalize the session']
  - ['Fusion i', 'Camera image under the points and boxes, on or off (kitty/sixel graphics; on by default locally, off over SSH)']
  - ['Labels {updown}', 'Select; the first rows are wind, waves and current']
  - ['Labels {leftright}', 'Set the selected condition: 0 unset, 1 calm, 2 moderate, 3 rough']
  - ['Labels y / r', 'Accept / reject the item (again: back to pending)']
  - ['Labels 1-9', 'Tag a mark; on a said item, its outcome: done, partly, failed, unsafe, ignored']
  - ['Labels n', 'Note on the item (the words of a said item)']
  - ['Labels s / m / u', 'Split the item at a mark or its middle / merge with the next / undo the last edit']
  - ['Labels Enter', 'Replay a closed session from the item']
  - ['Labels < >', 'Previous / next session']
  - ['Review p', 'Play / pause (arming, procedures and edits are off)']
  - ['Review {leftright} / {{ }}', 'Seek 5 s / 30 s']
  - ['Review , .', 'Previous / next marker']
  - ['Review < >', 'Playback rate']
  - ['Review z', 'Activity loupe zoom']
  - ['Review Esc', 'Back to live']
  - ['Manual w s {updown}', 'Surge (held keys drive; releasing them stops)', 'Manual (m): hold w/s, a/d, ←/→ together; +/- speed; x leaves']
  - ['Manual a d / {leftright}', 'Sway / yaw']
  - ['Manual + / -', 'Speed']
  - ['Manual Space', 'Stop and hold; manual stays open']
  - ['Manual x / m / Esc', 'Leave manual']
  - ['Run Space / q / Esc', 'Abort the running procedure']
  - ['Run m', 'Take over in manual (the run ends at neutral)']

