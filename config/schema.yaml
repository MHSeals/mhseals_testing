# The index of this package's schema: one fragment per config file, config/schema/<file>.yaml, whose
# keys all start with <file>. (mhseals_testing/schema.py). An entry: type, units, tier, doc, and range
# [lo, hi] only where a validator enforces exactly that range. Each area edits only its own fragment.
# fragments: the catalog's order; a fragment not listed follows them by name.
fragments: [characterize, tracking, fusion_panel, health, agent]
