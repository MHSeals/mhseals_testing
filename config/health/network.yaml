# Boat-link checks. The `network` probe (health/netstat.py) publishes the facts;
# nothing here gates motion. Bandwidth is a percentage of the link speed in /sys.
group: Network & DDS
probes:
  network:
    subnet: 192.168.0.0/24       # the interface holding an address here is the boat link
    period: 5
    # Hosts pinged once a second while the boat link is up: name -> hostname. The address is the
    # hostname's reservation in the workspace's config/boat-network.env, else what the resolver gives.
    peers:
      camera: blastoise-jetson
defaults:
  missing: skip                  # rates need two samples; no boat interface hides the group
checks:
  - id: net.bw
    kind: threshold
    fact: net.bw_pct
    warn: 40
    fail: 80
    below: false
    unit: ' %'
    title: Link use
  - id: net.errs
    kind: threshold
    fact: net.errs_ps
    warn: 0
    fail: 10
    below: false
    unit: ' /s'
    title: Interface errors
  - id: udp.drops
    kind: threshold
    fact: udp.drops_ps
    warn: 0
    fail: 50
    below: false
    unit: ' /s'
    title: UDP drops
    hint: 'RcvbufErrors: raise net.core.rmem_max. ReasmFails: use the 1400 B MTU in fastdds.xml.'
  - id: udp.noports
    kind: threshold
    fact: udp.noports_ps
    warn: 200
    fail: 1000000000
    below: false
    severity: info
    unit: ' /s'
    title: Packets to closed ports
  - id: net.addr_changed
    kind: threshold
    fact: net.addr_changed
    warn: 0.5
    fail: 2
    below: false
    title: Address changed
    hint: Nodes hold the old locator; restart them.
  - id: net.addr_events
    kind: threshold
    fact: net.addr_events_5m
    warn: 0.5
    fail: 2.5
    below: false
    title: Address changes in 5 min
  - id: net.peer.{name}.loss               # the host itself, apart from its ROS processes
    kind: threshold
    fact: net.loss_pct.{name}
    severity: fail
    warn: 10
    fail: 50
    below: false
    unit: ' %'
    title: '{name} host ping loss'
    hint: Lost pings mean the host is off or off the LAN, not just its container; at 100 % also check its boat-network.env reservation.
    each:
      - {name: camera}
  - id: net.peer.{name}.rtt
    kind: threshold
    fact: net.rtt_ms.{name}
    warn: 20
    fail: 100
    below: false
    unit: ' ms'
    title: '{name} host ping time'
    each:
      - {name: camera}
