# Boat-link checks. The `network` probe (health/netstat.py) publishes the facts;
# nothing here gates motion. Bandwidth is a percentage of the link speed in /sys.
group: Network & DDS
probes:
  # The boat link is the interface holding an address in BOAT_SUBNET (the vessel's network env, ASTRO_NETWORK_ENV).
  # While it is up, the hosts of the device registry's `ping:` roles are pinged once a second
  # (mhseals_testing.devices); the checks below judge the worst of them and name it.
  network:
    period: 5
  # Each computer reports its own parts (unit status --probe over one shared ssh connection per
  # host), every `period` s; DDS discovery never sets a part's state. A problem shows as an issue
  # (header and row glyph, and a toast) only once it lasts its grace: `grace_s` for a host whose
  # reads fail or a part that exited, `discovery_grace_s` for a running part's nodes missing from
  # this computer's graph (radio dropouts last about 5 s).
  devices:
    period: 5
    grace_s: 15
    discovery_grace_s: 20
defaults:
  missing: skip                  # rates need two samples; no boat interface hides the group
checks:
  - id: net.bw
    kind: threshold
    fact: net.bw_pct
    warn: 40
    fail: 80
    below: false
    unit: ' %'
    title: Link use
  - id: net.errs
    kind: threshold
    fact: net.errs_ps
    warn: 0
    fail: 10
    below: false
    unit: ' /s'
    title: Interface errors
  - id: udp.drops
    kind: threshold
    fact: udp.drops_ps
    warn: 0
    fail: 50
    below: false
    unit: ' /s'
    title: UDP drops
    hint: 'RcvbufErrors: raise net.core.rmem_max. ReasmFails: use the 1400 B MTU in fastdds.xml.'
  - id: udp.noports
    kind: threshold
    fact: udp.noports_ps
    warn: 200
    fail: 1000000000
    below: false
    severity: info
    unit: ' /s'
    title: Packets to closed ports
  - id: net.addr_changed
    kind: threshold
    fact: net.addr_changed
    warn: 0.5
    fail: 2
    below: false
    title: Address changed
    hint: Nodes hold the old locator; restart them.
  - id: net.addr_events
    kind: threshold
    fact: net.addr_events_5m
    warn: 0.5
    fail: 2.5
    below: false
    title: Address changes in 5 min
  - id: net.peer.loss                      # the host itself, apart from its ROS processes
    kind: threshold
    fact: net.loss_pct
    severity: fail
    warn: 10
    fail: 50
    below: false
    unit: ' %'
    title: ping loss to
    hint: Lost pings mean the host is off or off the LAN, not just its container; at 100 % also check its reservation in the vessel's network env.
  - id: net.peer.rtt
    kind: threshold
    fact: net.rtt_ms
    warn: 20
    fail: 100
    below: false
    unit: ' ms'
    title: ping time to
