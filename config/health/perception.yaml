# Perception checks, one set per detection source (perception.md section 5).
# The perception probe publishes perc.<source>.* facts from the canonical
# /detections topic and /perception/status; the boat has no camera topic of
# its own (the ZED runs on squirtle), so the camera row comes from these
# checks and the sensor:Camera anchor, not from a profile sensors row.
# A source is added by one row under each; its profiles list says where it runs.
group: Perception
defaults: {severity: warn, missing: skip}
checks:
  - id: perc.{source}.rate
    kind: threshold
    fact: perc.{source}.hz
    unit: ' Hz'
    show: ['sensor:Camera']
    title: Detections rate {source}
    message: '{value} of {nominal} Hz expected'
    hint: Frames include empty arrays; a low rate means the camera or detector is slow
    each:
      - {source: zed_native, profiles: [boat, dev_zed], nominal: 15, warn: 10, fail: 3}  # provisional until the Orin hz is measured (orin.md T3)
      - {source: sim, profiles: [crane_full_stack], nominal: 10, warn: 7, fail: 2}
  - id: perc.{source}.latency
    kind: threshold
    fact: perc.{source}.latency
    severity: fail
    below: false
    warn: 0.25
    fail: 0.5
    unit: ' s'
    title: Detection latency {source}
    hint: The tracker and converter reject stamps older than 1.0 s; check the clock offset and the funnel
    each:
      - {source: zed_native, profiles: [boat, dev_zed]}
      - {source: sim, profiles: [crane_full_stack]}
  - id: perc.{source}.funnel
    kind: threshold
    fact: perc.{source}.funnel_loss
    below: false
    warn: 0.15
    fail: 0.5
    title: Pipeline loss {source}
    hint: Share of frames lost between the first and last stage
    each:
      - {source: zed_native, profiles: [boat, dev_zed]}
  - id: perc.{source}.inference
    kind: threshold
    fact: perc.{source}.inference_ms
    below: false
    warn: 70
    fail: 130
    unit: ' ms'
    title: Inference time {source}
    hint: Object detection processing time from the ZED diagnostics; bands are provisional (about one and two frame periods at 15 Hz)
    each:
      - {source: zed_native, profiles: [boat, dev_zed]}
  - id: perc.{source}.clock
    kind: threshold
    fact: perc.{source}.clock_offset
    severity: fail
    abs: true
    below: false
    warn: 0.03
    fail: 0.08
    unit: ' s'
    title: Clock offset {source}
    hint: DDS source_timestamp offset on /front/zed_node; check chrony on the Orin
    each:
      - {source: zed_native, profiles: [boat, dev_zed]}
