# TUI speed (ui/perf.py): the ROS executor, how frames reach the terminal, and the budgets perf.json and
# test_perf_budget hold the TUI to.
tune:
  executor: single        # the TUI node's executor: events (rclpy's C++ EventsExecutor) or single (SingleThreadedExecutor)
  fps: 30                 # continuous redraws (driving, a run, a popup) at most this often
  fps_min: 5              # ... and at least this often, however slow frames are
  render_share: 0.5       # frames take at most this share of the UI thread: slower frames lower the rate (keys stay quick)
  sensor_node: true       # the profile's sensors and /tf on a node and executor thread of their own (fewer entities a message)
  diff: true              # write only the screen rows that changed since the last frame
  full_every: 5.0         # s between whole-screen redraws while diffing (0: only after a resize or another writer)
  sync: true              # wrap each frame in synchronized output, so the terminal shows it whole
  image_cap: 16           # most sixel images one frame paints, joining tile parts (tmux keeps 19); 0: each part alone
  snapshot: 0.02          # s a snapshot of the monitor is reused within one pass of the loop (0: never)
  hold:                   # s a slow panel's layout is reused between keys while the screen redraws (0: every frame)
    status: 0.5
    conditions: 0.2
    thrusters: 0.5
    procedures: 1.0
    activity: 0.5
  report_every: 2.0       # s between perf.json writes in the session directory (0: never)
budget:
  frame: 0.040            # s; frame time p99 (lay out and write one frame) on the boat computer
  key: 0.100              # s; key read to its frame written, p99
  window: 30.0            # s of frames and keys the percentiles cover
