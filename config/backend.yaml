# The UI-less TUI backend and its thin clients (D-20261101-19). The link only: boat_tui does not use it yet.
tune:
  attach_timeout: 1.0     # one attach attempt (connect, hello, welcome with the full snapshot) gives up after this
  heartbeat: 0.5          # a client pings this often; the backend answers each ping
  link_timeout: 2.0       # a link silent this long is lost: the client reconnects, the backend drops the client
  reconnect: [0.05, 1.0]  # a lost client's first and longest wait between attach attempts (doubling)
internal:
  socket: backend.sock    # in the runtime directory (harness.registry.runtime_dir), mode 0600
  max_frame: 1048576      # bytes in one frame, newline included
