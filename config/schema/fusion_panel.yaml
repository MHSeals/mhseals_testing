# fusion_panel.yaml (fusion/ros_feed.py, ui/panels/fusion.py): the Fusion tab.
fusion_panel.feed.points_rate: {type: float, units: Hz, tier: restart, doc: "Lidar scans projected per second in the Fusion tab."}
fusion_panel.feed.scan_dt_max: {type: float, units: s, tier: restart, doc: "A scan further than this from the boxes' stamp is drawn grey."}
fusion_panel.feed.camera_rate: {type: int, units: Hz, tier: restart, doc: "Camera frames per second under the points (1, 2 or 4)."}
fusion_panel.feed.max_range: {type: float, units: m, tier: restart, doc: "Points beyond this range are not drawn."}
fusion_panel.feed.residual_window: {type: float, units: s, tier: restart, doc: "Window of the residual trend."}
fusion_panel.feed.stale: {type: float, units: s, tier: restart, doc: "Boxes or points older than this are dropped."}
fusion_panel.draw_rate: {type: float, units: Hz, tier: restart, doc: "Camera and top-down repaints per second at most."}
fusion_panel.ramp: {type: list, units: m, tier: restart, doc: "Range breaks for the point colours spd.1..spd.5."}
fusion_panel.rings: {type: list, units: m, tier: restart, doc: "Top-down range rings."}
fusion_panel.tune.perception.loss_warn: {type: float, units: "1", range: [0, 1], tier: restart, doc: "Perception popup: a rate drop above this fraction between two stages marks the arrow."}
