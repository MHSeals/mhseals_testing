# backend.yaml (backend/protocol.py): the TUI backend link; protocol.py requires every number positive.
backend.tune.attach_timeout: {type: float, units: s, tier: restart, doc: "One attach attempt (connect, hello, welcome with the snapshot) gives up after this."}
backend.tune.heartbeat: {type: float, units: s, tier: restart, doc: "A client pings this often; the backend answers each ping."}
backend.tune.link_timeout: {type: float, units: s, tier: restart, doc: "A link silent this long is lost: the client reconnects, the backend drops it."}
backend.tune.reconnect: {type: list, units: s, tier: restart, doc: "A lost client's first and longest wait between attach attempts (doubling)."}
backend.tune.rates: {type: map, units: Hz, tier: restart, doc: "Per rate group but control (always on change), the most often one client gets the group's newest values."}
backend.tune.slow_client: {type: float, units: s, tier: restart, doc: "A client that takes no bytes for this long is dropped and resyncs on reconnect."}
backend.internal.socket: {type: str, units: file, tier: restart, doc: "Socket name in the runtime directory (mode 0600)."}
backend.internal.max_frame: {type: int, units: bytes, tier: restart, doc: "Bytes in one frame, newline included."}
backend.internal.outbox: {type: int, units: frames, tier: restart, doc: "Frames queued per client (control changes, replies, pongs); past it the client is dropped."}
backend.internal.requests: {type: int, units: requests, tier: restart, doc: "Queued requests per client; one past it is answered busy at once."}
backend.internal.priority: {type: list, units: op, tier: restart, doc: "Ops answered on the reader at once, ahead of every queued request (stop, e-stop, cancel arm)."}
backend: {closed: true}
